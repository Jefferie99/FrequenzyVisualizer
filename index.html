function drawBars(frame, t) {
  let levels = getSpectrumLevels(110);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  ctx.shadowBlur = 14 + (frame.mode==="pulse" ? frame.bass*28 : 0);
  ctx.shadowColor = frame.colors[0];
  const bw = canvas.width / levels.length;
  for (const lv of levels) {
    const h = lv.value * canvas.height * 0.96;
    const x = lv.normPos * canvas.width;
    const y = canvas.height - h;
    ctx.fillStyle = getModeColor(frame, lv.bandIndex, lv.normPos, lv.value);
    ctx.fillRect(x, y, Math.max(2, bw - 2), h);
  }
  ctx.shadowBlur = 0;
}

function drawMirror(frame, t) {
  let levels = getSpectrumLevels(100);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  const cy = canvas.height/2;
  const bw = canvas.width/levels.length;
  ctx.shadowBlur  = 16+(frame.mode==="pulse"?frame.bass*28:0);
  ctx.shadowColor = frame.colors[0];
  for (const lv of levels) {
    const size = lv.value*canvas.height*0.42;
    const x    = lv.normPos*canvas.width;
    const w    = Math.max(2,bw-2);
    ctx.fillStyle = getModeColor(frame,lv.bandIndex,lv.normPos,lv.value);
    ctx.fillRect(x, cy-size, w, size);
    ctx.fillRect(x, cy,      w, size);
  }
  ctx.shadowBlur = 0;
}
function drawArms(frame, t) {
  let levels = getSpectrumLevels(120);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);

  const cx = canvas.width / 2, cy = canvas.height / 2;
  const minDim   = Math.min(canvas.width, canvas.height);
  const pulseScale = (frame.mode === "pulse" ? 1 + frame.bass * 0.22 : 1)
                   * (1 + frame.beatStrength * 0.12);  // flare on beat

  // Inner ring radius — arms start here, not at the center
  const base = minDim * 0.10 * pulseScale;

  const armCount = 5;
  // Gentle constant curl per step — stable and readable, no erratic oscillation
  const curlPerStep = (Math.PI * 2 / levels.length) * 0.40;

  for (let i = 0; i < armCount; i++) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.lineCap = "round";

    // Each arm starts on the inner ring, evenly spaced
    const armAngle = t * 0.4 + (Math.PI * 2 * i) / armCount;
    let x = Math.cos(armAngle) * base;
    let y = Math.sin(armAngle) * base;
    let angle = armAngle;

    for (let j = 0; j < levels.length; j++) {
      const lv = levels[j];

      // Step length: audio-driven, with a gentle taper toward the tip
      // using sqrt so the outer half of the arm stays clearly visible
      const taper = Math.sqrt(1 - j / levels.length);
      const step  = lv.value * minDim * (1 / levels.length) * 1.8 * taper * pulseScale;

      const nx = x + Math.cos(angle) * step;
      const ny = y + Math.sin(angle) * step;

      const color = getModeColor(frame, lv.bandIndex, lv.normPos, lv.value);
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth   = 1.5 + lv.value * 2.5;
      ctx.shadowBlur  = 8 + lv.value * 12;
      ctx.shadowColor = color;
      ctx.moveTo(x, y);
      ctx.lineTo(nx, ny);
      ctx.stroke();

      x = nx;
      y = ny;
      angle += curlPerStep;
    }

    ctx.restore();
  }
  ctx.shadowBlur = 0;
}

function drawArms2(frame, t) {
  // The original "chaotic" arms — Math.sin(t) curl makes the arms
  // writhe unpredictably. Kept as a separate style for its organic energy.
  let levels = getSpectrumLevels(180);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  const cx = canvas.width/2, cy = canvas.height/2;
  const pulseScale = (frame.mode==="pulse" ? 1+frame.bass*0.22 : 1)
                   * (1 + frame.beatStrength * 0.12);

  const arms = 5;
  for (let i = 0; i < arms; i++) {
    ctx.save(); ctx.translate(cx, cy); ctx.lineCap = "round";
    const len    = levels.length;
    let mul      = 1.0;
    const mulSub = 1 / len;
    const add    = Math.sin(t) * Math.PI * 2 / len;  // the chaotic curl
    let oldX = 0, oldY = 0;
    let angle = t + Math.PI * 2 * i / arms;
    for (const lv of levels) {
      const extra = lv.value * Math.min(canvas.width, canvas.height) * mulSub * mul * pulseScale;
      const x = oldX + Math.cos(angle) * extra;
      const y = oldY + Math.sin(angle) * extra;
      angle += add;
      mul   -= mulSub;
      ctx.beginPath();
      ctx.strokeStyle = getModeColor(frame, lv.bandIndex, lv.normPos, lv.value);
      ctx.lineWidth   = 1.5 + lv.value * 2.5;
      ctx.shadowBlur  = 10 + lv.value * 10;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.moveTo(oldX, oldY);
      ctx.lineTo(x, y);
      ctx.stroke();
      oldX = x; oldY = y;
    }
    ctx.restore();
  }
  ctx.shadowBlur = 0;
}


  // Archimedean spiral: each frequency bin sits on the spiral path,
  // then spikes outward by its energy. Trails make it feel alive.
function drawSpiral(frame, t) {
  let levels = getSpectrumLevels(200);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);

  const cx = canvas.width / 2, cy = canvas.height / 2;
  const maxR      = Math.min(canvas.width, canvas.height) * 0.44;
  const turns     = 3.5;                          // how many times the spiral wraps
  const rotation  = t * 0.18;                     // slow continuous spin
  const pulseScale= frame.mode === "pulse" ? 1 + frame.bass * 0.18 : 1;

  ctx.save();
  ctx.translate(cx, cy);

  for (let i = 0; i < levels.length; i++) {
    const lv = levels[i];
    const norm  = i / (levels.length - 1);           // 0 → 1 along the spiral
    const angle = norm * Math.PI * 2 * turns + rotation;
    const baseR = norm * maxR * pulseScale;           // distance from centre along arm

    // spike length: quiet bins are nearly invisible, loud ones leap out
    const spike = lv.value * maxR * 0.28 * pulseScale;

    const x0 = Math.cos(angle) * baseR;
    const y0 = Math.sin(angle) * baseR;
    const x1 = Math.cos(angle) * (baseR + spike);
    const y1 = Math.sin(angle) * (baseR + spike);

    const color = getModeColor(frame, lv.bandIndex, norm, lv.value);

    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth   = 1.2 + lv.value * 3;
    ctx.shadowBlur  = 8 + lv.value * 14;
    ctx.shadowColor = color;
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  // Draw the spine of the spiral as a faint guide line
  ctx.beginPath();
  ctx.lineWidth   = 1;
  ctx.shadowBlur  = 0;
  ctx.strokeStyle = hexToRgba(frame.colors[0], 0.12);
  for (let i = 0; i <= 300; i++) {
    const norm  = i / 300;
    const angle = norm * Math.PI * 2 * turns + rotation;
    const r     = norm * maxR * pulseScale;
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  ctx.restore();
  ctx.shadowBlur = 0;
}

function drawCircle(frame, t) {
  let levels = getSpectrumLevels(180);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  const cx = canvas.width/2, cy = canvas.height/2;
  const pulseScale = frame.mode==="pulse" ? 1+frame.bass*0.22 : 1;
  const base = Math.min(canvas.width,canvas.height)*0.16*pulseScale;
  ctx.save(); ctx.translate(cx,cy); ctx.lineCap="round";
  for (const lv of levels) {
    const angle = lv.normPos*Math.PI*2+t*0.08;
    const extra = lv.value*Math.min(canvas.width,canvas.height)*0.22;
    ctx.beginPath();
    ctx.strokeStyle = getModeColor(frame,lv.bandIndex,lv.normPos,lv.value);
    ctx.lineWidth  = 1.5+lv.value*2.5;
    ctx.shadowBlur = 10+lv.value*10;
    ctx.shadowColor= ctx.strokeStyle;
    ctx.moveTo(Math.cos(angle)*base, Math.sin(angle)*base);
    ctx.lineTo(Math.cos(angle)*(base+extra), Math.sin(angle)*(base+extra));
    ctx.stroke();
  }
  ctx.beginPath(); ctx.lineWidth=2.5;
  ctx.strokeStyle=hexToRgba(frame.colors[0],0.25); ctx.shadowBlur=0;
  ctx.arc(0,0,base,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawStarburst(frame, t) {
  let levels = getSpectrumLevels(220);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  const cx=canvas.width/2, cy=canvas.height/2;
  const inner=Math.min(canvas.width,canvas.height)*0.05;
  ctx.save(); ctx.translate(cx,cy); ctx.lineCap="round";
  for (const lv of levels) {
    const angle = lv.normPos*Math.PI*2+t*0.22;
    const outer = inner+lv.value*Math.min(canvas.width,canvas.height)*0.38;
    ctx.beginPath();
    ctx.strokeStyle=getModeColor(frame,lv.bandIndex,lv.normPos,lv.value);
    ctx.lineWidth=1+lv.value*4; ctx.shadowBlur=14+lv.value*12; ctx.shadowColor=ctx.strokeStyle;
    ctx.moveTo(Math.cos(angle)*inner, Math.sin(angle)*inner);
    ctx.lineTo(Math.cos(angle)*outer, Math.sin(angle)*outer);
    ctx.stroke();
  }
  ctx.restore(); ctx.shadowBlur=0;
}

function drawTunnel(frame, t) {
  // Fixed: now routes through getSpectrumLevels + applyBehaviour
  // so all behaviours (wobbly, bouncy, breathing) work correctly.
  const ringCount = Math.max(12, getBandCount() * 4);
  let levels = getSpectrumLevels(ringCount);
  levels = applyBehaviour(levels, frame, t);

  clearCanvas(false);
  const cx = canvas.width/2, cy = canvas.height/2;
  const maxR = Math.min(canvas.width, canvas.height)*0.43;
  ctx.save(); ctx.translate(cx, cy);
  for (let i = 0; i < levels.length; i++) {
    const lv     = levels[i];
    const radius = ((i+1)/levels.length)*maxR + lv.value*18 + (frame.mode==="pulse" ? frame.bass*14 : 0);
    const color  = getModeColor(frame, lv.bandIndex, lv.normPos, lv.value);
    ctx.beginPath();
    ctx.strokeStyle = hexToRgba(color, 0.20+lv.value*0.70);
    ctx.lineWidth = 1+lv.value*4; ctx.shadowBlur = 10+lv.value*16; ctx.shadowColor = color;
    ctx.arc(0, 0, radius, t*0.1+i*0.15, t*0.1+i*0.15+Math.PI*1.75);
    ctx.stroke();
  }
  ctx.restore(); ctx.shadowBlur = 0;
}

function drawSkyline(frame, t) {
  let levels = getSpectrumLevels(120);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  const bw = canvas.width/levels.length;
  for (const lv of levels) {
    const h = 20+lv.value*canvas.height*0.72;
    const x = lv.normPos*canvas.width, y = canvas.height-h;
    const color = getModeColor(frame,lv.bandIndex,lv.normPos,lv.value);
    const grad = ctx.createLinearGradient(0,y,0,canvas.height);
    grad.addColorStop(0,hexToRgba(color,0.95)); grad.addColorStop(1,hexToRgba(color,0.05));
    ctx.fillStyle=grad; ctx.shadowBlur=14+lv.value*8; ctx.shadowColor=color;
    ctx.fillRect(x,y,Math.max(2,bw-1),h);
    ctx.fillStyle=color; ctx.fillRect(x,y,Math.max(2,bw-1),2);
  }
  ctx.shadowBlur=0;
}

function drawDots(frame, t) {
  let levels = getSpectrumLevels(95);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  for (const lv of levels) {
    const x=lv.normPos*canvas.width, y=canvas.height-lv.value*canvas.height;
    const r=2+lv.value*13;
    const color=getModeColor(frame,lv.bandIndex,lv.normPos,lv.value);
    ctx.shadowBlur=18+lv.value*12; ctx.shadowColor=color;
    ctx.beginPath(); ctx.fillStyle=hexToRgba(color,0.95); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle=hexToRgba(color,0.18); ctx.arc(x,y,r*2.3,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;
}

function drawWave(frame, t) {
  analyser.getByteTimeDomainData(timeData);
  clearCanvas(false);
  const centerY = canvas.height/2;
  const effect  = getEffectAmount();
  const behav   = behaviourSelect.value;
  const amp     = canvas.height*0.25*getSensitivity()*(frame.mode==="pulse"?1+frame.bass*0.2:1);
  const grad    = buildLinearGradient(0,0,canvas.width,0,frame);
  ctx.beginPath(); ctx.lineWidth=3; ctx.strokeStyle=grad;
  ctx.shadowBlur=16+frame.bass*12; ctx.shadowColor=frame.colors[0];
  for (let i=0; i<timeData.length; i++) {
    const x = (i/(timeData.length-1))*canvas.width;
    let v = (timeData[i] - 128) / 128;

// Browser/system capture often gives a calmer waveform.
// Boost only the visual wave reading, not the actual audio.
if (sourceModeSelect?.value === "display") {
  v *= 1.8;
}
    // Apply behaviour to wave amplitude
    if (behav==="wobbly")   v += Math.sin(i*0.08+t*3.2)*effect*0.4;
    if (behav==="bouncy")   v *= 1+frame.bass*effect*1.4;
    if (behav==="breathing") v *= 1+Math.sin(t*1.1)*effect*0.35;
    const y = centerY+v*amp;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke(); ctx.shadowBlur=0;
}

function drawMountain(frame, t) {
  let levels = getSpectrumLevels(160);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  const baseline=canvas.height*0.88;
  const grad=buildLinearGradient(0,0,canvas.width,0,frame);
  ctx.beginPath(); ctx.moveTo(0,canvas.height);
  for (const lv of levels) ctx.lineTo(lv.normPos*canvas.width, baseline-lv.value*canvas.height*0.68);
  ctx.lineTo(canvas.width,canvas.height); ctx.closePath();
  ctx.fillStyle=grad; ctx.globalAlpha=0.22;
  ctx.shadowBlur=18+frame.bass*12; ctx.shadowColor=frame.colors[0];
  ctx.fill(); ctx.globalAlpha=1;
  ctx.beginPath();
  for (let i=0; i<levels.length; i++) {
    const lv=levels[i];
    const x=lv.normPos*canvas.width, y=baseline-lv.value*canvas.height*0.68;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle=grad; ctx.lineWidth=2.5; ctx.stroke(); ctx.shadowBlur=0;
}

function drawOrbit(frame, t) {
  // Fixed: one level per band, routed through applyBehaviour.
  // Removed inline bouncy/breathing reimplementation — all four
  // behaviours now work correctly and future ones will too.
  const bc = frame.bandEnergies.length;
  let levels = getSpectrumLevels(bc);
  levels = applyBehaviour(levels, frame, t);

  clearCanvas(false);
  const cx = canvas.width/2, cy = canvas.height/2;
  const maxR = Math.min(canvas.width, canvas.height)*0.35;
  ctx.save(); ctx.translate(cx, cy);
  for (let i = 0; i < levels.length; i++) {
    const lv     = levels[i];
    const energy = lv.value;
    const radius = ((i+1)/levels.length)*maxR + energy*30;
    const color  = getModeColor(frame, lv.bandIndex, bc===1 ? 0 : i/(bc-1), energy);
    ctx.beginPath();
    ctx.strokeStyle = hexToRgba(color, 0.20+energy*0.45);
    ctx.lineWidth = 1.5+energy*3; ctx.shadowBlur = 14+energy*14; ctx.shadowColor = color;
    ctx.arc(0, 0, radius, 0, Math.PI*2); ctx.stroke();
    const particles = 3+Math.floor(energy*7);
    for (let p = 0; p < particles; p++) {
      const angle = t*(0.35+i*0.08) + p*((Math.PI*2)/particles);
      const r = 2+energy*6;
      ctx.beginPath(); ctx.fillStyle = color;
      ctx.arc(Math.cos(angle)*radius, Math.sin(angle)*radius, r, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore(); ctx.shadowBlur = 0;
}
function drawCrystalShards(frame, t) {
  let levels = getSpectrumLevels(90);
  levels = applyBehaviour(levels, frame, t);

  clearCanvas(false);

  const baseY = canvas.height * 0.88;
  const shardW = canvas.width / levels.length;
  const maxH = canvas.height * 0.65;

  ctx.save();

  for (const lv of levels) {
    const x = lv.normPos * canvas.width;
    const h = lv.value * maxH;
    const lean = Math.sin(t * 2 + lv.normPos * 10) * shardW * 0.35;
    const color = getModeColor(frame, lv.bandIndex, lv.normPos, lv.value);

    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.lineTo(x + shardW * 0.5 + lean, baseY - h);
    ctx.lineTo(x + shardW, baseY);
    ctx.closePath();

    ctx.fillStyle = hexToRgba(color, 0.72);
    ctx.shadowBlur = 10 + lv.value * 20;
    ctx.shadowColor = color;
    ctx.fill();

    ctx.strokeStyle = hexToRgba("#ffffff", 0.22);
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.restore();
  ctx.shadowBlur = 0;
}
function drawTronFloor(frame, t) {
  let levels = getSpectrumLevels(56);
  levels = applyBehaviour(levels, frame, t);

  clearCanvas(false);

  const cx = canvas.width / 2;
  const horizonY = canvas.height * 0.32;
  const topWidth = canvas.width * 0.10;
  const bottomWidth = canvas.width * 1.25;
  const floorBottomY = canvas.height;
  const rowCount = 22;
  const colCount = 14;

  const pulse = 1 + frame.bass * 0.08 + frame.beatStrength * 0.06;
  const scroll = (t * 6) % 1;

  function projectFloorPoint(u, depth) {
    const d = Math.max(0, Math.min(1, depth));
    const y = horizonY + Math.pow(d, 1.75) * (floorBottomY - horizonY);
    const halfWidth =
      ((topWidth + (bottomWidth - topWidth) * Math.pow(d, 1.12)) * pulse) / 2;

    return {
      x: cx + u * halfWidth,
      y
    };
  }

  // Background horizon glow
  const glow = ctx.createRadialGradient(
    cx, horizonY, 0,
    cx, horizonY, canvas.height * 0.65
  );
  glow.addColorStop(0, hexToRgba(frame.colors[0], 0.22 + frame.bass * 0.15));
  glow.addColorStop(0.35, hexToRgba(frame.colors[1] || frame.colors[0], 0.10));
  glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Horizon line
  ctx.beginPath();
  ctx.moveTo(0, horizonY);
  ctx.lineTo(canvas.width, horizonY);
  ctx.strokeStyle = hexToRgba(frame.colors[0], 0.30);
  ctx.lineWidth = 2;
  ctx.shadowBlur = 10;
  ctx.shadowColor = frame.colors[0];
  ctx.stroke();

  // Horizontal grid lines
  ctx.lineWidth = 1;
  for (let i = 0; i <= rowCount; i++) {
    let depth = (i + scroll) / rowCount;
    if (depth > 1) depth = 1;

    const left = projectFloorPoint(-1, depth);
    const right = projectFloorPoint(1, depth);

    const rowColor = getGradientColor(frame.colors, 1 - depth);
    ctx.beginPath();
    ctx.moveTo(left.x, left.y);
    ctx.lineTo(right.x, right.y);
    ctx.strokeStyle = hexToRgba(rowColor, 0.14 + depth * 0.22);
    ctx.shadowBlur = 8;
    ctx.shadowColor = rowColor;
    ctx.stroke();
  }

  // Vertical grid lines
  for (let c = -colCount; c <= colCount; c++) {
    const u = c / colCount;
    const color = getGradientColor(frame.colors, (u + 1) / 2);

    ctx.beginPath();
    for (let r = 0; r <= rowCount; r++) {
      const depth = r / rowCount;
      const p = projectFloorPoint(u, depth);
      if (r === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }

    ctx.strokeStyle = hexToRgba(color, 0.14);
    ctx.shadowBlur = 6;
    ctx.shadowColor = color;
    ctx.stroke();
  }

  // Audio-reactive pillars rising from the floor
  const pillarDepth = 0.62;

  for (const lv of levels) {
    const u = lv.normPos * 2 - 1;
    const base = projectFloorPoint(u, pillarDepth);

    const h = lv.value * canvas.height * 0.30 * (0.9 + frame.bass * 0.35);
    const w = Math.max(2, (bottomWidth / levels.length) * 0.22);

    const color = getModeColor(frame, lv.bandIndex, lv.normPos, lv.value);

    // Main pillar
    ctx.fillStyle = hexToRgba(color, 0.82);
    ctx.shadowBlur = 14 + lv.value * 16;
    ctx.shadowColor = color;
    ctx.fillRect(base.x - w / 2, base.y - h, w, h);

    // Bright top cap
    ctx.fillStyle = hexToRgba("#ffffff", 0.40);
    ctx.fillRect(base.x - w / 2, base.y - h, w, 2);

    // Small reflection on the floor
    ctx.fillStyle = hexToRgba(color, 0.14);
    ctx.fillRect(base.x - w / 2, base.y, w, h * 0.18);
  }

  // Center vanishing glow
  ctx.beginPath();
  ctx.arc(cx, horizonY, 16 + frame.bass * 22, 0, Math.PI * 2);
  ctx.fillStyle = hexToRgba(frame.colors[0], 0.18);
  ctx.shadowBlur = 24;
  ctx.shadowColor = frame.colors[0];
  ctx.fill();

  ctx.shadowBlur = 0;
}
function drawSpaceJellyfish(frame, t) {
  let levels = getSpectrumLevels(96);
  levels = applyBehaviour(levels, frame, t);

  clearCanvas(false);

  const minDim = Math.min(canvas.width, canvas.height);

  // Main swim cycle: this is what gives it the "jelly pulse"
  const swim = (Math.sin(t * 2.1) + 1) * 0.5; // 0..1
  const recoil = (Math.sin(t * 2.1 + Math.PI * 0.35) + 1) * 0.5;

  // Position drift
  const cx = canvas.width / 2 + Math.sin(t * 0.55) * minDim * 0.05;
  const cy =
    canvas.height * 0.40 +
    Math.sin(t * 0.9) * 10 -
    swim * 10;

  // Bell shape changes more than just scale
  const bassBoost = 1 + frame.bass * 0.10 + frame.beatStrength * 0.06;
  const bellW = minDim * 0.24 * bassBoost * (1 - swim * 0.06);
  const bellH = minDim * 0.16 * bassBoost * (1 + swim * 0.20);
  const rimDip = minDim * 0.012 + swim * minDim * 0.018;
  const tilt = Math.sin(t * 0.7) * 0.12;

  // Background glow
  const bgGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, minDim * 0.7);
  bgGlow.addColorStop(0, hexToRgba(frame.colors[0], 0.18 + frame.bass * 0.10));
  bgGlow.addColorStop(0.45, hexToRgba(frame.colors[1] || frame.colors[0], 0.08));
  bgGlow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = bgGlow;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Background particles / stars
  for (let i = 0; i < 75; i++) {
    const x = (Math.sin(i * 91.73) * 0.5 + 0.5) * canvas.width;
    const y =
      (((Math.cos(i * 47.13 + t * 0.12) * 0.5 + 0.5) * canvas.height) + t * 10 + i * 7) %
      canvas.height;

    const twinkle = 0.15 + 0.35 * Math.abs(Math.sin(t * 1.7 + i * 1.3));
    const color = frame.colors[i % frame.colors.length];

    ctx.beginPath();
    ctx.fillStyle = hexToRgba(color, twinkle * 0.30);
    ctx.arc(x, y, 0.8 + twinkle * 1.6, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);

  // =========================
  // Tentacles
  // =========================
  const tentacleCount = 18;
  const tentacleLength = minDim * (0.22 + frame.bass * 0.10 + swim * 0.10);

  ctx.lineCap = "round";

  for (let i = 0; i < tentacleCount; i++) {
    const n = tentacleCount === 1 ? 0 : i / (tentacleCount - 1);
    const lv = levels[Math.floor(n * (levels.length - 1))];
    const energy = lv.value;

    const spread = (n - 0.5) * bellW * 0.95;

    // Root moves with the bell rim
    const rootX = spread;
    const rootY =
      bellH * 0.18 +
      Math.sin(n * Math.PI * 4 + t * 3.2) * (rimDip * 0.7);

    const color = getModeColor(frame, lv.bandIndex, n, energy);

    ctx.beginPath();
    ctx.moveTo(rootX, rootY);

    let px = rootX;
    let py = rootY;

    const segs = 9;
    for (let s = 1; s <= segs; s++) {
      const p = s / segs;

      const lateral =
        Math.sin(t * 2.6 + i * 0.65 + p * 4.6) * (minDim * 0.03 + energy * minDim * 0.05) * (1 - p * 0.15) +
        Math.cos(t * 1.7 + i * 0.35 + p * 7.5) * (minDim * 0.01 + energy * minDim * 0.02);

      const x = rootX + lateral + (n - 0.5) * bellW * 0.10 * p;
      const y = rootY + p * tentacleLength + Math.sin(t * 1.8 + i + p * 6) * minDim * 0.008;

      ctx.lineTo(x, y);
      px = x;
      py = y;
    }

    ctx.strokeStyle = hexToRgba(color, 0.28 + energy * 0.48);
    ctx.lineWidth = 1.2 + energy * 4.2;
    ctx.shadowBlur = 8 + energy * 18;
    ctx.shadowColor = color;
    ctx.stroke();

    // Little glowing tip on stronger strands
    if (energy > 0.14) {
      ctx.beginPath();
      ctx.fillStyle = hexToRgba(color, 0.32 + energy * 0.45);
      ctx.arc(px, py, 1.5 + energy * 4.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // =========================
  // Oral arms (shorter inner ribbons)
  // =========================
  for (let i = 0; i < 4; i++) {
    const n = i / 3;
    const ox = (n - 0.5) * bellW * 0.22;
    const oy = bellH * 0.10;
    const len = minDim * (0.11 + swim * 0.03 + frame.bass * 0.03);
    const color = getGradientColor(frame.colors, n);

    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.bezierCurveTo(
      ox + Math.sin(t * 2.2 + i) * minDim * 0.025,
      oy + len * 0.30,
      ox - Math.cos(t * 1.7 + i) * minDim * 0.03,
      oy + len * 0.72,
      ox + Math.sin(t * 1.2 + i) * minDim * 0.02,
      oy + len
    );

    ctx.strokeStyle = hexToRgba(color, 0.28 + frame.bass * 0.18);
    ctx.lineWidth = 2.2 + frame.bass * 2.5;
    ctx.shadowBlur = 10;
    ctx.shadowColor = color;
    ctx.stroke();
  }

  // =========================
  // Bell body
  // =========================
  const bellGrad = ctx.createRadialGradient(
    0,
    -bellH * 0.35,
    0,
    0,
    0,
    bellW * 0.8
  );
  bellGrad.addColorStop(0, hexToRgba("#ffffff", 0.50));
  bellGrad.addColorStop(0.18, hexToRgba(frame.colors[0], 0.52));
  bellGrad.addColorStop(0.60, hexToRgba(frame.colors[1] || frame.colors[0], 0.26));
  bellGrad.addColorStop(1, hexToRgba(frame.colors[2] || frame.colors[0], 0.04));

  ctx.beginPath();

  // Top dome
  for (let i = 0; i <= 32; i++) {
    const p = i / 32;
    const x = -bellW * 0.5 + p * bellW;
    const nx = x / (bellW * 0.5);
    const y = -Math.sqrt(Math.max(0, 1 - nx * nx)) * bellH;

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  // Frilly underside / rim
  for (let i = 32; i >= 0; i--) {
    const p = i / 32;
    const x = -bellW * 0.5 + p * bellW;
    const wave =
      Math.sin(p * Math.PI * 6 + t * 4.8) * rimDip +
      Math.sin(p * Math.PI * 2 + t * 2.2) * rimDip * 0.45;

    const edgeShape = Math.sin(p * Math.PI);
    const y = bellH * 0.22 + wave - edgeShape * bellH * 0.10;

    ctx.lineTo(x, y);
  }

  ctx.closePath();

  ctx.fillStyle = bellGrad;
  ctx.shadowBlur = 24 + frame.bass * 20;
  ctx.shadowColor = frame.colors[0];
  ctx.fill();

  ctx.lineWidth = 2;
  ctx.strokeStyle = hexToRgba("#ffffff", 0.24 + swim * 0.10);
  ctx.stroke();

  // =========================
  // Inner ribs
  // =========================
  for (let i = 0; i < 8; i++) {
    const n = i / 7;
    const x = (n - 0.5) * bellW * 0.62;
    const color = getGradientColor(frame.colors, n);

    ctx.beginPath();
    ctx.moveTo(x, -bellH * 0.78);
    ctx.quadraticCurveTo(
      x * 0.55,
      -bellH * 0.18,
      x * 0.22,
      bellH * 0.12
    );

    ctx.strokeStyle = hexToRgba(color, 0.18 + swim * 0.16 + frame.bass * 0.10);
    ctx.lineWidth = 1.1 + frame.bass * 1.6;
    ctx.shadowBlur = 6;
    ctx.shadowColor = color;
    ctx.stroke();
  }

  // Highlight blob
  ctx.beginPath();
  ctx.ellipse(-bellW * 0.14, -bellH * 0.36, bellW * 0.13, bellH * 0.17, -0.45, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.13)";
  ctx.fill();

  // Beat halo
  if (frame.beatStrength > 0.03) {
    ctx.beginPath();
    ctx.arc(0, 0, bellW * (0.55 + frame.beatStrength * 0.28), 0, Math.PI * 2);
    ctx.strokeStyle = hexToRgba(frame.colors[0], 0.14 + frame.beatStrength * 0.22);
    ctx.lineWidth = 2 + frame.beatStrength * 4;
    ctx.shadowBlur = 24;
    ctx.shadowColor = frame.colors[0];
    ctx.stroke();
  }

  ctx.restore();
  ctx.shadowBlur = 0;
}
// ═══════════════════════════════════════════════════════
//  STAGE 4 — POST-PROCESS EFFECTS
//  Runs AFTER the visualizer draws to the canvas.
//  Each effect reads the current canvas pixels and writes back.
// ═══════════════════════════════════════════════════════
const POST_FX = {

  none() { /* nothing */ },

  bloom(frame) {
    // Simple glow: draw the canvas back on itself with additive blending
    ctx.globalCompositeOperation = "screen";
    ctx.globalAlpha = 0.18 + frame.bass * 0.12;
    ctx.filter = "blur(8px)";
    ctx.drawImage(canvas, 0, 0);
    ctx.filter = "none";
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  },

  glitch(frame, t) {
    const w = canvas.width, h = canvas.height;
    const bass = frame.bass;

    // ── 1. True RGB channel separation ──────────────────────────────
    // Work at half resolution for performance (4× fewer pixels).
    // At viewing distance the difference is invisible.
    const scale  = 0.5;
    const sw = Math.floor(w * scale), sh = Math.floor(h * scale);
    const shift  = Math.floor((3 + bass * 14) * scale); // px at half-res

    const off = document.createElement("canvas");
    off.width = sw; off.height = sh;
    const offCtx = off.getContext("2d");
    offCtx.drawImage(canvas, 0, 0, sw, sh);

    const src  = offCtx.getImageData(0, 0, sw, sh);
    const dst  = offCtx.createImageData(sw, sh);
    const s    = src.data, d = dst.data;

    for (let y = 0; y < sh; y++) {
      for (let x = 0; x < sw; x++) {
        const i = (y * sw + x) * 4;

        // Red: sampled shift pixels to the left
        const rSrc = x + shift < sw ? (y * sw + x + shift) * 4 : i;
        // Green: no shift
        const gSrc = i;
        // Blue: sampled shift pixels to the right
        const bSrc = x - shift >= 0  ? (y * sw + x - shift) * 4 : i;

        d[i]   = s[rSrc];       // R
        d[i+1] = s[gSrc + 1];   // G
        d[i+2] = s[bSrc + 2];   // B
        d[i+3] = 255;
      }
    }

    offCtx.putImageData(dst, 0, 0);

    // Blend the RGB-split layer over the canvas at partial opacity
    // so the original colors bleed through underneath.
    ctx.globalAlpha = 0.55 + bass * 0.25;
    ctx.drawImage(off, 0, 0, w, h);
    ctx.globalAlpha = 1;

    // ── 2. Horizontal slice displacement ────────────────────────────
    // On loud bass hits spawn more slices with bigger offsets.
    const sliceCount = Math.floor(2 + bass * 10);
    for (let s2 = 0; s2 < sliceCount; s2++) {
      // Each slice picks a random band of rows
      const sliceH  = Math.floor(1 + Math.random() * (4 + bass * 18));
      const sliceY  = Math.floor(Math.random() * (h - sliceH));
      const offsetX = (Math.random() * 2 - 1) * (8 + bass * 48);

      // Copy that strip from the canvas and repaint it displaced
      ctx.drawImage(
        canvas,
        0, sliceY, w, sliceH,         // source strip
        offsetX, sliceY, w, sliceH    // destination — shifted horizontally
      );
    }

    // ── 3. Digital noise lines ───────────────────────────────────────
    // Sparse white/color flashes — more frequent on transients.
    const lineCount = Math.floor(bass * 6);
    for (let l = 0; l < lineCount; l++) {
      const ly     = Math.floor(Math.random() * h);
      const lw     = Math.floor(w * (0.1 + Math.random() * 0.9));
      const lx     = Math.floor(Math.random() * (w - lw));
      const bright = 0.4 + Math.random() * 0.6;
      ctx.globalAlpha = bright * (0.4 + bass * 0.5);
      // Alternate between white and a palette color for variety
      ctx.fillStyle = Math.random() > 0.5 ? "#ffffff" : frame.colors[0];
      ctx.fillRect(lx, ly, lw, 1 + Math.floor(Math.random() * 2));
    }
    ctx.globalAlpha = 1;
  },

  // ── Beat FX ─────────────────────────────────────────────────────
  // These are event-driven — they react to discrete beat onsets,
  // not continuous audio energy. Each works with any style.

  beatflash(frame) {
    // Hard white strobe — very short decay, feels like a camera flash.
    // More aggressive than the old soft bloom.
    if (beat.flashAlpha <= 0.005) return;
    ctx.fillStyle = `rgba(255,255,255,${beat.flashAlpha * 0.85})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  },

  particles(frame) {
    // Spawn a burst of particles from center on each beat.
    // Particles fly outward, decelerate, and fade.
    const cx = canvas.width / 2, cy = canvas.height / 2;
    if (beat.active) {
      beat.spawnParticles(cx, cy, frame.colors, beat.strength);
    }
    for (const p of beat.particles) {
      const alpha = Math.max(0, p.life / p.maxLife);
      const r     = p.r * alpha;
      ctx.beginPath();
      ctx.fillStyle   = hexToRgba(p.color, alpha * 0.9);
      ctx.shadowBlur  = 8 + (1 - alpha) * 0;
      ctx.shadowColor = p.color;
      ctx.arc(p.x, p.y, Math.max(0.5, r), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  },

  shockwave(frame) {
    // A ring expands from center on each beat, fading as it grows.
    const cx = canvas.width / 2, cy = canvas.height / 2;
    const maxR = Math.max(canvas.width, canvas.height) * 0.75;
    if (beat.active) {
      beat.spawnShockwave(cx, cy, maxR, frame.colors[0], beat.strength);
    }
    for (const s of beat.shockwaves) {
      const progress = 1 - s.life / s.maxLife;       // 0 → 1 as it expands
      const alpha    = (1 - progress) * (0.5 + s.strength * 0.4);
      const width    = 2 + s.strength * 6 * (1 - progress);
      ctx.beginPath();
      ctx.strokeStyle = hexToRgba(s.color, alpha);
      ctx.lineWidth   = width;
      ctx.shadowBlur  = 12 + s.strength * 20;
      ctx.shadowColor = s.color;
      ctx.arc(cx, cy, s.radius, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  },

  colorshift(frame) {
    // On beat, tint the entire canvas toward the next palette color
    // for a few frames — gives the impression of a color "cut".
    if (beat.colorShift <= 0.005) return;
    // Pick the next color in the palette by rotating the index
    const nextColor = frame.colors[Math.min(frame.colors.length - 1,
                        Math.floor(frame.colors.length * 0.5))];
    ctx.fillStyle   = hexToRgba(nextColor, beat.colorShift * 0.28);
    ctx.globalCompositeOperation = "screen";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = "source-over";
  },

  shake(frame) {
    // Camera shake is applied in the draw loop (must wrap the style draw,
    // not run after it). This entry is a no-op stub so the select works —
    // the actual shake logic lives in the draw loop where ctx.translate happens.
  },
	scanlines(frame) {
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = "#000";
    for (let y = 0; y < canvas.height; y += 3) {
      ctx.fillRect(0, y, canvas.width, 1);
    }
    ctx.globalAlpha = 1;
  },

  vhs(frame) {
    // Scanlines + slight horizontal noise
    POST_FX.scanlines();
    ctx.globalAlpha = 0.04 + frame.bass * 0.06;
    ctx.fillStyle = "#fff";
    const noiseY = Math.random() * canvas.height;
    ctx.fillRect(0, noiseY, canvas.width, 1 + Math.random() * 3);
    ctx.globalAlpha = 1;
    // Colour bleed
    ctx.globalCompositeOperation = "screen";
    ctx.globalAlpha = 0.08;
    ctx.drawImage(canvas, Math.random()*4-2, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  },

  pixelate(frame) {
    const size = Math.max(2, Math.floor(4 + frame.bass * 12));
    const w    = canvas.width, h = canvas.height;
    // Downscale then upscale trick using getImageData is too slow per-frame.
    // Instead we use canvas scale trick with imageSmoothingEnabled off.
    const offscreen = document.createElement("canvas");
    offscreen.width  = Math.floor(w / size);
    offscreen.height = Math.floor(h / size);
    const offCtx = offscreen.getContext("2d");
    offCtx.drawImage(canvas, 0, 0, offscreen.width, offscreen.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(offscreen, 0, 0, w, h);
    ctx.imageSmoothingEnabled = true;
  }

};
// ═══════════════════════════════════════════════════════
//  REGISTER EXISTING POST FX INTO MODULE REGISTRY
// ═══════════════════════════════════════════════════════
Object.entries(POST_FX).forEach(([id, applyFn]) => {
  const names = {
    none: "None",
    bloom: "Bloom",
    glitch: "Glitch",
    scanlines: "Scanlines",
    vhs: "VHS",
    pixelate: "Pixelate",
    beatflash: "Beat Flash",
    particles: "Beat Particles",
    shockwave: "Beat Shockwave",
    colorshift: "Beat Color Shift",
    shake: "Beat Shake"
  };

  const descriptions = {
    none: "No post-processing.",
    bloom: "Adds a soft glow by redrawing the canvas with blur.",
    glitch: "Adds RGB separation, slice displacement and noise lines.",
    scanlines: "Adds dark horizontal scanlines.",
    vhs: "Adds scanlines, noise and slight color bleed.",
    pixelate: "Pixelates the final canvas image.",
    beatflash: "Flashes the screen on detected beats.",
    particles: "Spawns particles on detected beats.",
    shockwave: "Spawns expanding rings on detected beats.",
    colorshift: "Tints the canvas on detected beats.",
    shake: "Applies beat-based camera shake in the draw loop."
  };

  VisualizerModules.register("postFx", {
    id,
    name: names[id] || id,
    description: descriptions[id] || "",
    apply: applyFn
  });
});
	
function applyPostFx(frame, t) {
  const name = postFxSelect.value;

  const effect =
    VisualizerModules.get("postFx", name) ||
    VisualizerModules.get("postFx", "none");

  if (!effect || typeof effect.apply !== "function") {
    return;
  }

  effect.apply(frame, t);
}

// ═══════════════════════════════════════════════════════
//  MAIN DRAW LOOP
// ═══════════════════════════════════════════════════════
function draw(now=0) {
  rafId = requestAnimationFrame(draw);
  if (!analyser || !freqData || !timeData) return;

  analyser.getByteFrequencyData(freqData);

  const rawBass = averageBins(freqToBin(20), freqToBin(250)) / 255;
  beat.update(rawBass, now);

  const frame = getFrameData();
  const t     = now * 0.001;
  const style = visualizerSelect.value;
  const fx    = postFxSelect.value;

  // ── Beat: camera shake (must wrap the style draw) ────────────────
  const doShake = fx === "shake" && (Math.abs(beat.shakeX) > 0.3 || Math.abs(beat.shakeY) > 0.3);
  // ── Beat: scale pulse (subtle, always on) ────────────────────────
  const doScale = beat.scaleOffset > 0.0005;

  if (doShake || doScale) {
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    if (doScale) ctx.scale(1 + beat.scaleOffset, 1 + beat.scaleOffset);
    if (doShake) ctx.translate(beat.shakeX, beat.shakeY);
    ctx.translate(-canvas.width / 2, -canvas.height / 2);
  }

// Stage 3 — Style
const styleDef =
  VisualizerModules.get("styles", style) ||
  VisualizerModules.get("styles", "bars");

if (styleDef && typeof styleDef.draw === "function") {
  styleDef.draw(frame, t);
}

if (doShake || doScale) ctx.restore();
	
  // Stage 4 — Post FX
  applyPostFx(frame, t);
}

// ═══════════════════════════════════════════════════════
//  AUDIO DEVICE MANAGEMENT
// ═══════════════════════════════════════════════════════
async function loadDevices() {
  try {
    const devices    = await navigator.mediaDevices.enumerateDevices();
    const audioInputs= devices.filter(d=>d.kind==="audioinput");
    deviceSelect.innerHTML = "";
    const def = document.createElement("option"); def.value=""; def.textContent="Default mic / VB Cable";
    deviceSelect.appendChild(def);
    audioInputs.forEach((d,i) => {
      const o = document.createElement("option"); o.value=d.deviceId; o.textContent=d.label||`Microphone ${i+1}`;
      deviceSelect.appendChild(o);
    });
    deviceSelect.value = currentDeviceId;
  } catch(e) { console.error(e); }
}

function cleanupAudio() {
  if (rafId !== null) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }	
  if (sourceNode)  { try{sourceNode.disconnect();}catch(e){} sourceNode=null; }
  if (sourceGain)  { try{sourceGain.disconnect();}catch(e){} sourceGain=null; }
  if (analyser)    { try{analyser.disconnect();}catch(e){} analyser=null; }
  if (silentGain)  { try{silentGain.disconnect();}catch(e){} silentGain=null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
  freqData=null; timeData=null;
}

function setupAnalyserFromStream(stream) {
  mediaStream = stream;

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = parseInt(fftSizeSelect.value, 10);
  analyser.smoothingTimeConstant = getSourceProfile().smoothing;
  analyser.minDecibels = -90;
  analyser.maxDecibels = -10;
  rebuildDataArrays();

sourceNode = audioCtx.createMediaStreamSource(mediaStream);

  sourceGain = audioCtx.createGain();
  sourceGain.gain.value = getInputBoost();
  
  silentGain = audioCtx.createGain();
  silentGain.gain.value = 0;
  
  sourceNode.connect(sourceGain);
  sourceGain.connect(analyser);
  analyser.connect(silentGain);
  silentGain.connect(audioCtx.destination);

  startBtn.disabled = true;
  startBtn.classList.add("running");
  stopBtn.disabled = false;

  setStatus("Live ✦", "active");
  pokeUI();
  draw();
}

async function prepareAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (audioCtx.state === "suspended") {
    await audioCtx.resume();
  }
}

async function startMicVisualizer(deviceId = "") {
  try {
    cleanupAudio();
    setStatus("Starting mic…");

    await prepareAudioContext();

    const constraints = {
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    };

    if (deviceId) {
      constraints.audio.deviceId = { exact: deviceId };
    }

    const stream = await navigator.mediaDevices.getUserMedia(constraints);

    currentDeviceId = deviceId;
    setupAnalyserFromStream(stream);

    await loadDevices();
    deviceSelect.value = currentDeviceId;
    deviceSelect.classList.remove("needs-apply");

  } catch (err) {
    console.error(err);
    setStatus("Error", "error");
	startBtn.disabled = false;
    startBtn.classList.remove("running");
    stopBtn.disabled = true;
    alert("Microphone error: " + err.message);
  }
}

async function startDisplayAudioVisualizer() {
  try {
    cleanupAudio();
    setStatus("Choose source…");

    await prepareAudioContext();

    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: true,

      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      },

      // Browser hints.
      // Some browsers may ignore these.
      systemAudio: "include",
      windowAudio: "system",
      surfaceSwitching: "include"
    });

    const audioTracks = stream.getAudioTracks();
    console.log("Display audio track settings:", audioTracks[0]?.getSettings());
    console.log("Display audio track constraints:", audioTracks[0]?.getConstraints());
    
    if (!audioTracks.length) {
      stream.getTracks().forEach(track => track.stop());
      throw new Error("No audio was shared. Try again and enable 'Share tab audio' or 'Share system audio' in the browser picker.");
    }

    currentDeviceId = "";
    setupAnalyserFromStream(stream);
    

  } catch (err) {
    console.error(err);
    setStatus("Error", "error");

    if (err.name === "NotAllowedError") {
      alert("Audio capture was cancelled or blocked.");
    } else {
      alert("Audio capture error: " + err.message);
    }
  }
}

async function startVisualizer(deviceId = "") {
  if (sourceModeSelect.value === "display") {
    return startDisplayAudioVisualizer();
  }

  return startMicVisualizer(deviceId);
}

function stopVisualizer() {
  cleanupAudio();
  beat.reset();
  startBtn.disabled = false;
  startBtn.classList.remove("running");
  stopBtn.disabled  = true;
  setStatus("Stopped");
  clearCanvas(true); pokeUI();
}

// ─── Event listeners ───
startBtn.addEventListener("click", () => startVisualizer(deviceSelect.value));
stopBtn.addEventListener("click", stopVisualizer);

function updateSourceModeUI() {
  const usingDisplayAudio = sourceModeSelect.value === "display";

  deviceSelectWrap.classList.toggle("hidden-ctrl", usingDisplayAudio);
  deviceSelect.disabled = usingDisplayAudio;

  startBtn.textContent = usingDisplayAudio ? "▶ Choose audio" : "▶ Start";

  if (!stopBtn.disabled) {
    stopVisualizer();
  }

  pokeUI();
}

sourceModeSelect.addEventListener("change", updateSourceModeUI);

// Device auto-applies when using mic mode
deviceSelect.addEventListener("change", () => {
  if (sourceModeSelect.value !== "mic") {
    pokeUI();
    return;
  }

  if (!stopBtn.disabled) {
    startVisualizer(deviceSelect.value);
  }

  pokeUI();
});

fftSizeSelect.addEventListener("change", () => {
  if (analyser) { analyser.fftSize=parseInt(fftSizeSelect.value,10); rebuildDataArrays(); } pokeUI();
});
bandSplitSelect.addEventListener("change", () => {
  currentBandColors = adaptColorsToCount(currentBandColors, getBandCount());
  if (paletteSelect.value!=="custom") currentBandColors=getPaletteColors(paletteSelect.value,getBandCount());
  renderBandColorEditors(); pokeUI();
});
paletteSelect.addEventListener("change", () => { applyPaletteSelection(); pokeUI(); });
modeSelect.addEventListener("change",      () => { clearCanvas(true); pokeUI(); });
visualizerSelect.addEventListener("change",() => { clearCanvas(true); pokeUI(); });
behaviourSelect.addEventListener("change", () => { updateIntensityVisibility(); clearCanvas(true); pokeUI(); });
postFxSelect.addEventListener("change",    () => { clearCanvas(true); pokeUI(); });

sensitivitySlider.addEventListener("input", () => {
  sensitivityValue.textContent = Number(sensitivitySlider.value).toFixed(1); pokeUI();
});
inputBoostSlider.addEventListener("input", () => {
  inputBoostValue.textContent = Number(inputBoostSlider.value).toFixed(1);

  if (sourceGain) {
    sourceGain.gain.value = getInputBoost();
  }

  pokeUI();
});
trailSlider.addEventListener("input", () => { trailValue.textContent=trailSlider.value; pokeUI(); });
effectSlider.addEventListener("input",() => { effectValue.textContent=effectSlider.value; pokeUI(); });

if (navigator.mediaDevices?.addEventListener) {
  navigator.mediaDevices.addEventListener("devicechange", loadDevices);
}

// ─── Init ───
populateSelectFromRegistry(behaviourSelect, VisualizerModules.behaviours, "rigid");
populateSelectFromRegistry(visualizerSelect, VisualizerModules.styles, "bars");
populateSelectFromRegistry(postFxSelect, VisualizerModules.postFx, "none");
populatePaletteSelectFromRegistry("neon");

sensitivityValue.textContent = sensitivitySlider.value;
inputBoostValue.textContent = Number(inputBoostSlider.value).toFixed(1);
trailValue.textContent       = trailSlider.value;
effectValue.textContent      = effectSlider.value;
currentBandColors = getPaletteColors("neon", getBandCount());
renderBandColorEditors();
updateIntensityVisibility();
updateSourceModeUI();
loadDevices();
clearCanvas(true);
pokeUI();
</script>
</body>
</html>
