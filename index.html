<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frequency Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .controls {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: rgba(0, 0, 0, 0.72);
      padding: 10px 12px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
    }

    button, select, input[type="color"] {
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      background: #2b2b2b;
      color: white;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #3b3b3b;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: black;
    }

    #status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(0,0,0,0.72);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
      color: #ccc;
      backdrop-filter: blur(6px);
    }

    #deviceSelect {
      max-width: 260px;
    }

    #visualizerSelect {
      min-width: 140px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>

    <label>
      FFT size
      <select id="fftSizeSelect">
        <option value="1024" selected>1024</option>
        <option value="2048">2048</option>
        <option value="4096">4096</option>
      </select>
    </label>

    <label>
      Color
      <input type="color" id="colorPicker" value="#00ff66" />
    </label>

    <label>
      Visualizer
      <select id="visualizerSelect">
        <option value="bars">Bars</option>
        <option value="mirror">Mirror</option>
        <option value="circle">Circle</option>
        <option value="wave">Wave</option>
        <option value="dots">Dots</option>
        <option value="starburst">Starburst</option>
        <option value="tunnel">Tunnel</option>
        <option value="mountain">Mountain</option>
      </select>
    </label>

    <label>
      Device
      <select id="deviceSelect">
        <option value="">Default microphone</option>
      </select>
    </label>

    <button id="changeDeviceBtn" disabled>Change device</button>
  </div>

  <canvas id="canvas"></canvas>
  <div id="status">Idle</div>

  <script>
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let silentGain = null;
    let mediaStream = null;
    let rafId = null;
    let freqData = null;
    let timeData = null;
    let currentDeviceId = "";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const fftSizeSelect = document.getElementById("fftSizeSelect");
    const colorPicker = document.getElementById("colorPicker");
    const visualizerSelect = document.getElementById("visualizerSelect");
    const deviceSelect = document.getElementById("deviceSelect");
    const changeDeviceBtn = document.getElementById("changeDeviceBtn");
    const statusEl = document.getElementById("status");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function hexToRgb(hex) {
      return {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
      };
    }

    function hexToRgba(hex, alpha) {
      const { r, g, b } = hexToRgb(hex);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function rebuildDataArrays() {
      if (!analyser) return;
      freqData = new Uint8Array(analyser.frequencyBinCount);
      timeData = new Uint8Array(analyser.fftSize);
    }

    function averageBand(start, size) {
      let sum = 0;
      let count = 0;

      for (let i = 0; i < size; i++) {
        const index = start + i;
        if (index < freqData.length) {
          sum += freqData[index];
          count++;
        }
      }

      return count ? sum / count : 0;
    }

    async function loadDevices() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(device => device.kind === "audioinput");

        deviceSelect.innerHTML = "";

        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "Default microphone";
        deviceSelect.appendChild(defaultOption);

        audioInputs.forEach((device, index) => {
          const option = document.createElement("option");
          option.value = device.deviceId;
          option.textContent = device.label || `Microphone ${index + 1}`;
          deviceSelect.appendChild(option);
        });

        deviceSelect.value = currentDeviceId;
      } catch (err) {
        console.error("Device load error:", err);
      }
    }

    function cleanupAudio() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      if (sourceNode) {
        try { sourceNode.disconnect(); } catch (e) {}
        sourceNode = null;
      }

      if (analyser) {
        try { analyser.disconnect(); } catch (e) {}
        analyser = null;
      }

      if (silentGain) {
        try { silentGain.disconnect(); } catch (e) {}
        silentGain = null;
      }

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
    }

    async function startVisualizer(deviceId = "") {
      try {
        cleanupAudio();
        setStatus("Requesting microphone...");

        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioCtx.state === "suspended") {
          await audioCtx.resume();
        }

        const constraints = {
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        };

        if (deviceId) {
          constraints.audio.deviceId = { exact: deviceId };
        }

        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        currentDeviceId = deviceId;

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = parseInt(fftSizeSelect.value, 10);
        analyser.smoothingTimeConstant = 0.84;
        analyser.minDecibels = -90;
        analyser.maxDecibels = -10;

        rebuildDataArrays();

        sourceNode = audioCtx.createMediaStreamSource(mediaStream);

        silentGain = audioCtx.createGain();
        silentGain.gain.value = 0;

        sourceNode.connect(analyser);
        analyser.connect(silentGain);
        silentGain.connect(audioCtx.destination);

        startBtn.disabled = true;
        stopBtn.disabled = false;
        changeDeviceBtn.disabled = false;

        await loadDevices();
        deviceSelect.value = currentDeviceId;

        setStatus("Mic running ✅");
        draw();
      } catch (err) {
        console.error(err);
        setStatus("Mic error: " + err.message);
        alert("Microphone error: " + err.message);
      }
    }

    function stopVisualizer() {
      cleanupAudio();

      startBtn.disabled = false;
      stopBtn.disabled = true;
      changeDeviceBtn.disabled = true;

      setStatus("Stopped");

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function clearSolid() {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function clearTrail(alpha = 0.14) {
      ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawBars(color) {
      analyser.getByteFrequencyData(freqData);
      clearSolid();

      const visibleBars = 128;
      const step = Math.max(1, Math.floor(freqData.length / visibleBars));
      const barWidth = canvas.width / visibleBars;

      ctx.shadowBlur = 18;
      ctx.shadowColor = color;

      for (let i = 0; i < visibleBars; i++) {
        const average = averageBand(i * step, step);
        const barHeight = (average / 255) * canvas.height;
        const x = i * barWidth;
        const y = canvas.height - barHeight;

        ctx.fillStyle = color;
        ctx.fillRect(x, y, Math.max(2, barWidth - 2), barHeight);
      }

      ctx.shadowBlur = 0;
    }

    function drawMirror(color) {
      analyser.getByteFrequencyData(freqData);
      clearTrail(0.18);

      const visibleBars = 96;
      const step = Math.max(1, Math.floor(freqData.length / visibleBars));
      const barWidth = canvas.width / visibleBars;
      const centerY = canvas.height / 2;

      ctx.shadowBlur = 20;
      ctx.shadowColor = color;
      ctx.fillStyle = color;

      for (let i = 0; i < visibleBars; i++) {
        const average = averageBand(i * step, step);
        const size = (average / 255) * (canvas.height * 0.42);
        const x = i * barWidth;
        const w = Math.max(2, barWidth - 2);

        ctx.fillRect(x, centerY - size, w, size);
        ctx.fillRect(x, centerY, w, size);
      }

      ctx.shadowBlur = 0;
    }

    function drawCircle(color) {
      analyser.getByteFrequencyData(freqData);
      clearTrail(0.12);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = Math.min(canvas.width, canvas.height) * 0.18;
      const points = 180;
      const step = Math.max(1, Math.floor(freqData.length / points));

      ctx.save();
      ctx.translate(cx, cy);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 16;
      ctx.shadowColor = color;

      for (let i = 0; i < points; i++) {
        const average = averageBand(i * step, step);
        const extra = (average / 255) * (Math.min(canvas.width, canvas.height) * 0.22);
        const angle = (i / points) * Math.PI * 2;

        const x1 = Math.cos(angle) * radius;
        const y1 = Math.sin(angle) * radius;
        const x2 = Math.cos(angle) * (radius + extra);
        const y2 = Math.sin(angle) * (radius + extra);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.strokeStyle = hexToRgba(color, 0.35);
      ctx.lineWidth = 3;
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function drawWave(color) {
      analyser.getByteTimeDomainData(timeData);
      clearTrail(0.15);

      ctx.beginPath();
      ctx.lineWidth = 3;
      ctx.strokeStyle = color;
      ctx.shadowBlur = 18;
      ctx.shadowColor = color;

      const sliceWidth = canvas.width / timeData.length;
      let x = 0;

      for (let i = 0; i < timeData.length; i++) {
        const v = timeData[i] / 128.0;
        const y = (v * canvas.height) / 2;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);

        x += sliceWidth;
      }

      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawDots(color) {
      analyser.getByteFrequencyData(freqData);
      clearTrail(0.10);

      const count = 96;
      const step = Math.max(1, Math.floor(freqData.length / count));
      const barWidth = canvas.width / count;

      ctx.shadowBlur = 22;
      ctx.shadowColor = color;

      for (let i = 0; i < count; i++) {
        const average = averageBand(i * step, step);
        const norm = average / 255;
        const x = i * barWidth + barWidth / 2;
        const y = canvas.height - norm * canvas.height;
        const r = 2 + norm * 12;

        ctx.beginPath();
        ctx.fillStyle = hexToRgba(color, 0.95);
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = hexToRgba(color, 0.25);
        ctx.arc(x, y, r * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.shadowBlur = 0;
    }

    function drawStarburst(color) {
      analyser.getByteFrequencyData(freqData);
      clearTrail(0.12);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const baseRadius = Math.min(canvas.width, canvas.height) * 0.08;
      const rays = 220;
      const step = Math.max(1, Math.floor(freqData.length / rays));

      ctx.save();
      ctx.translate(cx, cy);
      ctx.lineCap = "round";
      ctx.shadowBlur = 20;
      ctx.shadowColor = color;

      for (let i = 0; i < rays; i++) {
        const average = averageBand(i * step, step);
        const norm = average / 255;
        const angle = (i / rays) * Math.PI * 2;
        const inner = baseRadius;
        const outer = inner + norm * Math.min(canvas.width, canvas.height) * 0.35;

        ctx.beginPath();
        ctx.strokeStyle = hexToRgba(color, 0.25 + norm * 0.75);
        ctx.lineWidth = 1 + norm * 4;
        ctx.moveTo(Math.cos(angle) * inner, Math.sin(angle) * inner);
        ctx.lineTo(Math.cos(angle) * outer, Math.sin(angle) * outer);
        ctx.stroke();
      }

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function drawTunnel(color) {
      analyser.getByteFrequencyData(freqData);
      clearTrail(0.08);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const rings = 12;
      const maxRadius = Math.min(canvas.width, canvas.height) * 0.42;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.shadowBlur = 18;
      ctx.shadowColor = color;

      for (let i = 0; i < rings; i++) {
        const bandIndex = Math.floor((i / rings) * freqData.length * 0.7);
        const average = averageBand(bandIndex, 8);
        const norm = average / 255;
        const radius = ((i + 1) / rings) * maxRadius + norm * 20;

        ctx.beginPath();
        ctx.strokeStyle = hexToRgba(color, 0.10 + (i / rings) * 0.45 + norm * 0.25);
        ctx.lineWidth = 1 + norm * 4;
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function drawMountain(color) {
      analyser.getByteFrequencyData(freqData);
      clearTrail(0.16);

      const points = 160;
      const step = Math.max(1, Math.floor(freqData.length / points));
      const baseline = canvas.height * 0.88;

      ctx.beginPath();
      ctx.moveTo(0, canvas.height);

      for (let i = 0; i < points; i++) {
        const average = averageBand(i * step, step);
        const norm = average / 255;
        const x = (i / (points - 1)) * canvas.width;
        const y = baseline - norm * canvas.height * 0.65;
        ctx.lineTo(x, y);
      }

      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();

      const gradient = ctx.createLinearGradient(0, baseline - canvas.height * 0.6, 0, canvas.height);
      gradient.addColorStop(0, hexToRgba(color, 0.85));
      gradient.addColorStop(1, hexToRgba(color, 0.05));

      ctx.fillStyle = gradient;
      ctx.shadowBlur = 18;
      ctx.shadowColor = color;
      ctx.fill();

      ctx.beginPath();
      for (let i = 0; i < points; i++) {
        const average = averageBand(i * step, step);
        const norm = average / 255;
        const x = (i / (points - 1)) * canvas.width;
        const y = baseline - norm * canvas.height * 0.65;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function draw() {
      rafId = requestAnimationFrame(draw);

      if (!analyser || !freqData || !timeData) return;

      const color = colorPicker.value;
      const mode = visualizerSelect.value;

      if (mode === "bars") drawBars(color);
      else if (mode === "mirror") drawMirror(color);
      else if (mode === "circle") drawCircle(color);
      else if (mode === "wave") drawWave(color);
      else if (mode === "dots") drawDots(color);
      else if (mode === "starburst") drawStarburst(color);
      else if (mode === "tunnel") drawTunnel(color);
      else if (mode === "mountain") drawMountain(color);
    }

    startBtn.addEventListener("click", async () => {
      await startVisualizer(deviceSelect.value);
    });

    stopBtn.addEventListener("click", stopVisualizer);

    changeDeviceBtn.addEventListener("click", async () => {
      await startVisualizer(deviceSelect.value);
    });

    fftSizeSelect.addEventListener("change", () => {
      if (analyser) {
        analyser.fftSize = parseInt(fftSizeSelect.value, 10);
        rebuildDataArrays();
      }
    });

    visualizerSelect.addEventListener("change", () => {
      clearSolid();
    });

    navigator.mediaDevices.addEventListener?.("devicechange", loadDevices);

    loadDevices();
  </script>
</body>
</html>
