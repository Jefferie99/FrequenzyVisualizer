<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Real-Time Frequency Visualizer (Public Overlay)</title>
  <style>
    body { margin:0; background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; color:#fff; }
    #canvas { width:100%; height:420px; display:block; background:#000; }
    .controls { position: absolute; top: 10px; left: 10px; display:flex; gap:8px; background: rgba(0,0,0,0.4); padding:8px; border-radius:6px; }
    select, input { padding:6px 8px; border-radius:6px; border:1px solid #333; background:#222; color:#fff; }
  </style>
</head>
<body>
  <div class="controls" aria-label="Controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
    <label>FFT size
      <select id="fftSizeSelect">
        <option value="1024">1024</option>
        <option value="2048" selected>2048</option>
        <option value="4096">4096</option>
      </select>
    </label>
    <label>Bar color
      <input type="color" id="colorPicker" value="#00ff00">
    </label>
  </div>

  <canvas id="canvas" width="1280" height="420"></canvas>

  <script>
    let audioCtx, analyser, dataArray, bufferLength;
    let sourceNode;
    let rafId;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const fftSizeSelect = document.getElementById('fftSizeSelect');
    const colorPicker = document.getElementById('colorPicker');
    let barColor = colorPicker.value;
    colorPicker.addEventListener('input', (e) => { barColor = e.target.value; });

startBtn.addEventListener('click', async () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // Ensure the audio context is running
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = parseInt(fftSizeSelect.value, 10);
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    sourceNode = audioCtx.createMediaStreamSource(stream);
    sourceNode.connect(analyser);
    // Optional: analyser.connect(audioCtx.destination);
  } catch (err) {
    console.error('Mic access error:', err);
    alert('Could not access microphone: ' + err.message);
    return;
  }

  startBtn.disabled = true;
  stopBtn.disabled = false;
  draw();
});

    stopBtn.addEventListener('click', () => {
      if (rafId) cancelAnimationFrame(rafId);
      if (sourceNode) {
        try { sourceNode.disconnect(); } catch (e) {}
      }
      if (analyser) {
        try { analyser.disconnect(); } catch (e) {}
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    function draw() {
      rafId = requestAnimationFrame(draw);
      if (!analyser) return;

      analyser.getByteFrequencyData(dataArray);

      // Clear
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bars
      const barCount = bufferLength;
      const barWidth = Math.floor(canvas.width / barCount);
      const gap = 1;
      const width = barWidth - gap;

      for (let i = 0; i < barCount; i++) {
        const mag = dataArray[i] / 255;
        const barH = mag * canvas.height;
        const x = i * barWidth;
        const y = canvas.height - barH;
        ctx.fillStyle = barColor;
        ctx.fillRect(x, y, width, barH);
      }
    }
  </script>
</body>
</html>
