<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frequency Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --panel-bg: rgba(0, 0, 0, 0.72);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #cfcfcf;
      --bg: #020202;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .controls {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .controls.hidden {
      opacity: 0;
      transform: translateY(-140%);
      pointer-events: none;
    }

    .group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      flex-wrap: wrap;
    }

    button,
    select,
    input[type="color"],
    input[type="range"] {
      background: #222;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
    }

    button,
    select,
    input[type="color"] {
      padding: 8px 10px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #303030;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 120px;
      padding: 0;
      accent-color: #00ff88;
    }

    input[type="checkbox"] {
      accent-color: #00ff88;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 12px;
    }

    .status-badge {
      margin-left: auto;
      min-width: 110px;
      color: #f2f2f2;
      background: rgba(255, 255, 255, 0.10);
    }

    #deviceSelect {
      max-width: 220px;
    }

    #visualizerSelect {
      min-width: 120px;
    }

    #paletteSelect {
      min-width: 110px;
    }

    #bandColorEditors {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .band-editor {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 12px;
      color: var(--muted);
    }

    .band-editor input[type="color"] {
      width: 34px;
      height: 28px;
      padding: 0;
      border-radius: 6px;
      background: transparent;
    }

    .hint {
      position: fixed;
      bottom: 12px;
      left: 12px;
      z-index: 10;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.55);
      color: #bdbdbd;
      font-size: 12px;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <div class="controls" id="controls">
    <div class="group">
      <button id="startBtn">Start</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>

    <div class="group">
      <label>
        Style
        <select id="visualizerSelect">
          <option value="bars">Bars</option>
          <option value="mirror">Mirror</option>
          <option value="circle">Circle</option>
          <option value="starburst">Starburst</option>
          <option value="tunnel">Tunnel</option>
          <option value="skyline">Skyline</option>
          <option value="dots">Dots</option>
          <option value="wave">Wave</option>
          <option value="mountain">Mountain</option>
          <option value="orbit">Orbit</option>
        </select>
      </label>
    </div>

    <div class="group">
      <label>
        FFT
        <select id="fftSizeSelect">
          <option value="1024" selected>1024</option>
          <option value="2048">2048</option>
          <option value="4096">4096</option>
        </select>
      </label>
    </div>

    <div class="group">
      <label>
        Mode
        <select id="modeSelect">
          <option value="single">Single</option>
          <option value="split" selected>Split</option>
          <option value="heat">Heat</option>
          <option value="pulse">Pulse</option>
          <option value="rainbow">Rainbow</option>
        </select>
      </label>

      <label>
        Bands
        <select id="bandSplitSelect">
          <option value="1">1 Band</option>
          <option value="3" selected>3 Bands</option>
          <option value="5">5 Bands</option>
        </select>
      </label>

      <label>
        Palette
        <select id="paletteSelect">
          <option value="custom">Custom</option>
          <option value="neon" selected>Neon</option>
          <option value="fire">Fire</option>
          <option value="ocean">Ocean</option>
          <option value="synthwave">Synthwave</option>
          <option value="twitch">Twitch</option>
          <option value="forest">Forest</option>
          <option value="sunset">Sunset</option>
          <option value="mono">Mono</option>
        </select>
      </label>
    </div>

    <div class="group" id="bandColorEditors"></div>

    <div class="group">
      <label>
        Sensitivity
        <input type="range" id="sensitivitySlider" min="0.5" max="4" step="0.1" value="1.8" />
      </label>
      <span class="badge" id="sensitivityValue">1.8</span>
    </div>

    <div class="group">
      <label>
        Trails
        <input type="range" id="trailSlider" min="0" max="95" step="1" value="70" />
      </label>
      <span class="badge" id="trailValue">70</span>
    </div>

    <div class="group">
      <label>
        Device
        <select id="deviceSelect">
          <option value="">Default microphone</option>
        </select>
      </label>
      <button id="changeDeviceBtn" disabled>Change device</button>
    </div>

    <div class="group">
      <label>
        <input type="checkbox" id="autoHideChk" checked />
        Auto-hide UI
      </label>
    </div>

    <span class="badge status-badge" id="statusBadge">Idle</span>
  </div>

  <canvas id="canvas"></canvas>
  <div class="hint">Move mouse to show controls</div>

  <script>
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let silentGain = null;
    let mediaStream = null;
    let rafId = null;
    let freqData = null;
    let timeData = null;
    let currentDeviceId = "";
    let hideTimer = null;
    let currentBandColors = [];

    const PALETTES = {
      neon: ["#ff00cc", "#ff7a00", "#ffe600", "#00ffcc", "#6a5cff"],
      fire: ["#ff2a2a", "#ff6a00", "#ffb000", "#ffd54a", "#fff4b0"],
      ocean: ["#003cff", "#0088ff", "#00d5ff", "#7cf7ff", "#e8ffff"],
      synthwave: ["#ff2ea6", "#ff5f8f", "#b56bff", "#5d8dff", "#00f7ff"],
      twitch: ["#9146ff", "#b266ff", "#e76fff", "#00d1ff", "#ffffff"],
      forest: ["#0b5d1e", "#198f36", "#33c85a", "#8cf29a", "#dcffe2"],
      sunset: ["#ff4f6d", "#ff7a45", "#ffb347", "#ffd166", "#fff2b2"],
      mono: ["#3a3a3a", "#666666", "#9a9a9a", "#d0d0d0", "#ffffff"]
    };

    const BAND_PRESETS = {
      1: [{ name: "Full", low: 20, high: 16000 }],
      3: [
        { name: "Low", low: 20, high: 250 },
        { name: "Mid", low: 250, high: 2000 },
        { name: "High", low: 2000, high: 16000 }
      ],
      5: [
        { name: "Low End", low: 20, high: 120 },
        { name: "Low Mid", low: 120, high: 400 },
        { name: "Mid", low: 400, high: 2000 },
        { name: "High Mid", low: 2000, high: 6000 },
        { name: "High End", low: 6000, high: 16000 }
      ]
    };

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const controls = document.getElementById("controls");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const visualizerSelect = document.getElementById("visualizerSelect");
    const fftSizeSelect = document.getElementById("fftSizeSelect");
    const modeSelect = document.getElementById("modeSelect");
    const bandSplitSelect = document.getElementById("bandSplitSelect");
    const paletteSelect = document.getElementById("paletteSelect");
    const bandColorEditors = document.getElementById("bandColorEditors");
    const sensitivitySlider = document.getElementById("sensitivitySlider");
    const sensitivityValue = document.getElementById("sensitivityValue");
    const trailSlider = document.getElementById("trailSlider");
    const trailValue = document.getElementById("trailValue");
    const deviceSelect = document.getElementById("deviceSelect");
    const changeDeviceBtn = document.getElementById("changeDeviceBtn");
    const autoHideChk = document.getElementById("autoHideChk");
    const statusBadge = document.getElementById("statusBadge");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function setStatus(text) {
      statusBadge.textContent = text;
    }

    function updateSliderLabels() {
      sensitivityValue.textContent = Number(sensitivitySlider.value).toFixed(1);
      trailValue.textContent = trailSlider.value;
    }

    function pokeUI() {
      controls.classList.remove("hidden");
      clearTimeout(hideTimer);

      if (!autoHideChk.checked) return;

      hideTimer = setTimeout(() => {
        if (!controls.matches(":hover")) {
          controls.classList.add("hidden");
        }
      }, 2200);
    }

    window.addEventListener("mousemove", pokeUI);
    window.addEventListener("mousedown", pokeUI);
    window.addEventListener("touchstart", pokeUI, { passive: true });
    window.addEventListener("keydown", pokeUI);
    controls.addEventListener("mouseenter", () => clearTimeout(hideTimer));
    controls.addEventListener("mouseleave", pokeUI);

    autoHideChk.addEventListener("change", () => {
      controls.classList.remove("hidden");
      pokeUI();
    });

    function hexToRgb(hex) {
      return {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
      };
    }

    function rgbToHex(r, g, b) {
      const toHex = (v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

    function hexToRgba(hex, alpha) {
      const { r, g, b } = hexToRgb(hex);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function lerpColor(c1, c2, t) {
      const a = hexToRgb(c1);
      const b = hexToRgb(c2);
      return rgbToHex(
        lerp(a.r, b.r, t),
        lerp(a.g, b.g, t),
        lerp(a.b, b.b, t)
      );
    }

    function mixColors(c1, c2, amount) {
      return lerpColor(c1, c2, Math.max(0, Math.min(1, amount)));
    }

    function getBandCount() {
      return parseInt(bandSplitSelect.value, 10);
    }

    function getBandConfig() {
      return BAND_PRESETS[getBandCount()];
    }

    function adaptColorsToCount(colors, count) {
      const source = colors && colors.length ? colors.slice() : PALETTES.neon.slice();

      if (count === source.length) return source.slice();

      if (count === 1) {
        return [source[Math.floor(source.length / 2)]];
      }

      if (source.length === 1) {
        return new Array(count).fill(source[0]);
      }

      const result = [];
      for (let i = 0; i < count; i++) {
        const t = count === 1 ? 0 : i / (count - 1);
        const pos = t * (source.length - 1);
        const idx = Math.floor(pos);
        const frac = pos - idx;
        const c1 = source[idx];
        const c2 = source[Math.min(idx + 1, source.length - 1)];
        result.push(lerpColor(c1, c2, frac));
      }
      return result;
    }

    function getPaletteColors(name, count) {
      if (name === "custom") {
        return adaptColorsToCount(currentBandColors, count);
      }
      return adaptColorsToCount(PALETTES[name] || PALETTES.neon, count);
    }

    function renderBandColorEditors() {
      const bands = getBandConfig();
      currentBandColors = adaptColorsToCount(currentBandColors, bands.length);
      bandColorEditors.innerHTML = "";

      bands.forEach((band, index) => {
        const wrap = document.createElement("div");
        wrap.className = "band-editor";

        const label = document.createElement("span");
        label.textContent = band.name;

        const input = document.createElement("input");
        input.type = "color";
        input.value = currentBandColors[index];

        input.addEventListener("input", () => {
          currentBandColors[index] = input.value;
          paletteSelect.value = "custom";
          pokeUI();
        });

        wrap.appendChild(label);
        wrap.appendChild(input);
        bandColorEditors.appendChild(wrap);
      });
    }

    function applyPaletteSelection() {
      currentBandColors = getPaletteColors(paletteSelect.value, getBandCount());
      renderBandColorEditors();
    }

    function getSensitivity() {
      return parseFloat(sensitivitySlider.value);
    }

    function applySensitivity(v) {
      const boosted = v * getSensitivity();
      return Math.min(1, Math.pow(boosted, 0.92));
    }

    function getTrailAmount() {
      return parseInt(trailSlider.value, 10);
    }

    function clearCanvas(forceSolid = false) {
      if (forceSolid || getTrailAmount() <= 0) {
        ctx.fillStyle = "#000";
      } else {
        const alpha = Math.max(0.025, (100 - getTrailAmount()) / 140);
        ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
      }
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function rebuildDataArrays() {
      if (!analyser) return;
      freqData = new Uint8Array(analyser.frequencyBinCount);
      timeData = new Uint8Array(analyser.fftSize);
    }

    function freqToBin(freq) {
      if (!freqData || !audioCtx) return 0;
      const nyquist = audioCtx.sampleRate / 2;
      const clamped = Math.max(0, Math.min(freq, nyquist));
      return Math.max(0, Math.min(freqData.length - 1, Math.floor((clamped / nyquist) * freqData.length)));
    }

    function getBandBins() {
      const config = getBandConfig();
      return config.map((band) => ({
        name: band.name,
        low: freqToBin(band.low),
        high: Math.max(freqToBin(band.high), freqToBin(band.low) + 1)
      }));
    }

    function averageBins(start, end) {
      let sum = 0;
      let count = 0;
      const s = Math.max(0, start);
      const e = Math.min(freqData.length, end);

      for (let i = s; i < e; i++) {
        sum += freqData[i];
        count++;
      }

      return count ? sum / count : 0;
    }

    function getBandIndexForBin(bin, bandBins) {
      for (let i = 0; i < bandBins.length; i++) {
        if (bin >= bandBins[i].low && bin < bandBins[i].high) return i;
      }
      return bandBins.length - 1;
    }

    function getBandEnergies(bandBins) {
      return bandBins.map((band) => applySensitivity(averageBins(band.low, band.high) / 255));
    }

    function getSpectrumLevels(count, maxFreq = 16000) {
      const maxBin = Math.max(8, freqToBin(maxFreq));
      const step = Math.max(1, Math.floor(maxBin / count));
      const bandBins = getBandBins();

      const levels = [];
      for (let i = 0; i < count; i++) {
        const start = i * step;
        const end = Math.min(maxBin, start + step);
        const avg = averageBins(start, end);
        const value = applySensitivity(avg / 255);
        const midBin = Math.floor((start + end) / 2);
        const bandIndex = getBandIndexForBin(midBin, bandBins);

        levels.push({
          value,
          raw: avg / 255,
          bandIndex,
          normPos: count === 1 ? 0 : i / (count - 1),
          startBin: start,
          endBin: end
        });
      }

      return levels;
    }

    function getFrameData() {
      const bandBins = getBandBins();
      const bandEnergies = getBandEnergies(bandBins);
      const bass = bandEnergies[0] || 0;
      const colors = adaptColorsToCount(currentBandColors, getBandCount());

      return {
        bandBins,
        bandEnergies,
        bass,
        colors,
        mode: modeSelect.value
      };
    }

    function getGradientColor(colors, t) {
      const palette = colors.length ? colors : ["#00ff88"];
      if (palette.length === 1) return palette[0];

      const clamped = Math.max(0, Math.min(1, t));
      const pos = clamped * (palette.length - 1);
      const idx = Math.floor(pos);
      const frac = pos - idx;
      const c1 = palette[idx];
      const c2 = palette[Math.min(idx + 1, palette.length - 1)];
      return lerpColor(c1, c2, frac);
    }

    function getModeColor(frame, bandIndex, normPos, intensity) {
      const mode = frame.mode;
      const colors = frame.colors;
      const safeBandIndex = Math.max(0, Math.min(colors.length - 1, bandIndex));
      const bandColor = colors[safeBandIndex] || colors[0] || "#00ff88";

      if (mode === "single") {
        const base = colors[0] || "#00ff88";
        return mixColors(base, "#ffffff", intensity * 0.18);
      }

      if (mode === "split") {
        return bandColor;
      }

      if (mode === "heat") {
        return mixColors(bandColor, "#ffffff", intensity * 0.75);
      }

      if (mode === "pulse") {
        return mixColors(bandColor, "#ffffff", Math.min(0.7, frame.bass * 0.45 + intensity * 0.25));
      }

      if (mode === "rainbow") {
        const rainbowBase = getGradientColor(colors, normPos);
        return mixColors(rainbowBase, "#ffffff", intensity * 0.22);
      }

      return bandColor;
    }

    function buildLinearGradientFromColors(x0, y0, x1, y1, frame) {
      const grad = ctx.createLinearGradient(x0, y0, x1, y1);
      const colors = frame.mode === "single" ? [frame.colors[0], frame.colors[0]] : frame.colors;

      if (colors.length === 1) {
        grad.addColorStop(0, colors[0]);
        grad.addColorStop(1, colors[0]);
        return grad;
      }

      colors.forEach((color, index) => {
        const stop = colors.length === 1 ? 0 : index / (colors.length - 1);
        grad.addColorStop(stop, color);
      });

      return grad;
    }

    async function loadDevices() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(d => d.kind === "audioinput");

        deviceSelect.innerHTML = "";

        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "Default microphone";
        deviceSelect.appendChild(defaultOption);

        audioInputs.forEach((device, index) => {
          const option = document.createElement("option");
          option.value = device.deviceId;
          option.textContent = device.label || `Microphone ${index + 1}`;
          deviceSelect.appendChild(option);
        });

        deviceSelect.value = currentDeviceId;
      } catch (err) {
        console.error("Device load error:", err);
      }
    }

    function cleanupAudio() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      if (sourceNode) {
        try { sourceNode.disconnect(); } catch (e) {}
        sourceNode = null;
      }

      if (analyser) {
        try { analyser.disconnect(); } catch (e) {}
        analyser = null;
      }

      if (silentGain) {
        try { silentGain.disconnect(); } catch (e) {}
        silentGain = null;
      }

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }

      freqData = null;
      timeData = null;
    }

    async function startVisualizer(deviceId = "") {
      try {
        cleanupAudio();
        setStatus("Starting...");

        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioCtx.state === "suspended") {
          await audioCtx.resume();
        }

        const constraints = {
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        };

        if (deviceId) {
          constraints.audio.deviceId = { exact: deviceId };
        }

        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        currentDeviceId = deviceId;

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = parseInt(fftSizeSelect.value, 10);
        analyser.smoothingTimeConstant = 0.84;
        analyser.minDecibels = -90;
        analyser.maxDecibels = -10;

        rebuildDataArrays();

        sourceNode = audioCtx.createMediaStreamSource(mediaStream);

        silentGain = audioCtx.createGain();
        silentGain.gain.value = 0;

        sourceNode.connect(analyser);
        analyser.connect(silentGain);
        silentGain.connect(audioCtx.destination);

        startBtn.disabled = true;
        stopBtn.disabled = false;
        changeDeviceBtn.disabled = false;

        await loadDevices();
        deviceSelect.value = currentDeviceId;

        setStatus("Mic running ✅");
        pokeUI();
        draw();
      } catch (err) {
        console.error(err);
        setStatus("Mic error");
        alert("Microphone error: " + err.message);
      }
    }

    function stopVisualizer() {
      cleanupAudio();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      changeDeviceBtn.disabled = true;
      setStatus("Stopped");
      clearCanvas(true);
      pokeUI();
    }

    function drawBars(frame) {
      const levels = getSpectrumLevels(110);
      clearCanvas(false);

      ctx.shadowBlur = 14 + (frame.mode === "pulse" ? frame.bass * 28 : 0);
      ctx.shadowColor = frame.colors[0];

      const barWidth = canvas.width / levels.length;
      for (const level of levels) {
        const h = level.value * canvas.height * 0.96;
        const x = level.normPos * canvas.width;
        const y = canvas.height - h;
        ctx.fillStyle = getModeColor(frame, level.bandIndex, level.normPos, level.value);
        ctx.fillRect(x, y, Math.max(2, barWidth - 2), h);
      }

      ctx.shadowBlur = 0;
    }

    function drawMirror(frame) {
      const levels = getSpectrumLevels(100);
      clearCanvas(false);

      const centerY = canvas.height / 2;
      const barWidth = canvas.width / levels.length;

      ctx.shadowBlur = 16 + (frame.mode === "pulse" ? frame.bass * 28 : 0);
      ctx.shadowColor = frame.colors[0];

      for (const level of levels) {
        const size = level.value * canvas.height * 0.42;
        const x = level.normPos * canvas.width;
        const w = Math.max(2, barWidth - 2);
        ctx.fillStyle = getModeColor(frame, level.bandIndex, level.normPos, level.value);
        ctx.fillRect(x, centerY - size, w, size);
        ctx.fillRect(x, centerY, w, size);
      }

      ctx.shadowBlur = 0;
    }

    function drawCircle(frame, t) {
      const levels = getSpectrumLevels(180);
      clearCanvas(false);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const pulseScale = frame.mode === "pulse" ? 1 + frame.bass * 0.22 : 1;
      const baseRadius = Math.min(canvas.width, canvas.height) * 0.16 * pulseScale;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.lineCap = "round";

      for (const level of levels) {
        const angle = level.normPos * Math.PI * 2 + t * 0.08;
        const extra = level.value * Math.min(canvas.width, canvas.height) * 0.22;
        const x1 = Math.cos(angle) * baseRadius;
        const y1 = Math.sin(angle) * baseRadius;
        const x2 = Math.cos(angle) * (baseRadius + extra);
        const y2 = Math.sin(angle) * (baseRadius + extra);

        ctx.beginPath();
        ctx.strokeStyle = getModeColor(frame, level.bandIndex, level.normPos, level.value);
        ctx.lineWidth = 1.5 + level.value * 2.5;
        ctx.shadowBlur = 10 + level.value * 10;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = hexToRgba(frame.colors[0], 0.25);
      ctx.shadowBlur = 0;
      ctx.arc(0, 0, baseRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    function drawStarburst(frame, t) {
      const levels = getSpectrumLevels(220);
      clearCanvas(false);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const inner = Math.min(canvas.width, canvas.height) * 0.05;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.lineCap = "round";

      for (const level of levels) {
        const angle = level.normPos * Math.PI * 2 + t * 0.22;
        const outer = inner + level.value * Math.min(canvas.width, canvas.height) * 0.38;

        ctx.beginPath();
        ctx.strokeStyle = getModeColor(frame, level.bandIndex, level.normPos, level.value);
        ctx.lineWidth = 1 + level.value * 4;
        ctx.shadowBlur = 14 + level.value * 12;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.moveTo(Math.cos(angle) * inner, Math.sin(angle) * inner);
        ctx.lineTo(Math.cos(angle) * outer, Math.sin(angle) * outer);
        ctx.stroke();
      }

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function drawTunnel(frame, t) {
      analyser.getByteFrequencyData(freqData);
      clearCanvas(false);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const maxRadius = Math.min(canvas.width, canvas.height) * 0.43;
      const ringCount = Math.max(12, frame.bandEnergies.length * 4);

      ctx.save();
      ctx.translate(cx, cy);

      for (let i = 0; i < ringCount; i++) {
        const bandIndex = i % frame.bandEnergies.length;
        const energy = frame.bandEnergies[bandIndex];
        const radius = ((i + 1) / ringCount) * maxRadius + energy * 18 + (frame.mode === "pulse" ? frame.bass * 14 : 0);
        const color = getModeColor(frame, bandIndex, i / Math.max(1, ringCount - 1), energy);

        ctx.beginPath();
        ctx.strokeStyle = hexToRgba(color, 0.20 + energy * 0.70);
        ctx.lineWidth = 1 + energy * 4;
        ctx.shadowBlur = 10 + energy * 16;
        ctx.shadowColor = color;
        ctx.arc(0, 0, radius, t * 0.1 + i * 0.15, t * 0.1 + i * 0.15 + Math.PI * 1.75);
        ctx.stroke();
      }

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function drawSkyline(frame) {
      const levels = getSpectrumLevels(120);
      clearCanvas(false);

      const barWidth = canvas.width / levels.length;

      for (const level of levels) {
        const h = 20 + level.value * canvas.height * 0.72;
        const x = level.normPos * canvas.width;
        const y = canvas.height - h;
        const color = getModeColor(frame, level.bandIndex, level.normPos, level.value);

        const grad = ctx.createLinearGradient(0, y, 0, canvas.height);
        grad.addColorStop(0, hexToRgba(color, 0.95));
        grad.addColorStop(1, hexToRgba(color, 0.05));

        ctx.fillStyle = grad;
        ctx.shadowBlur = 14 + level.value * 8;
        ctx.shadowColor = color;
        ctx.fillRect(x, y, Math.max(2, barWidth - 1), h);

        ctx.fillStyle = color;
        ctx.fillRect(x, y, Math.max(2, barWidth - 1), 2);
      }

      ctx.shadowBlur = 0;
    }

    function drawDots(frame) {
      const levels = getSpectrumLevels(95);
      clearCanvas(false);

      for (const level of levels) {
        const x = level.normPos * canvas.width;
        const y = canvas.height - level.value * canvas.height;
        const r = 2 + level.value * 13;
        const color = getModeColor(frame, level.bandIndex, level.normPos, level.value);

        ctx.shadowBlur = 18 + level.value * 12;
        ctx.shadowColor = color;

        ctx.beginPath();
        ctx.fillStyle = hexToRgba(color, 0.95);
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = hexToRgba(color, 0.18);
        ctx.arc(x, y, r * 2.3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.shadowBlur = 0;
    }

    function drawWave(frame) {
      analyser.getByteTimeDomainData(timeData);
      clearCanvas(false);

      const centerY = canvas.height / 2;
      const amp = canvas.height * 0.25 * getSensitivity() * (frame.mode === "pulse" ? 1 + frame.bass * 0.2 : 1);

      const gradient = buildLinearGradientFromColors(0, 0, canvas.width, 0, frame);

      ctx.beginPath();
      ctx.lineWidth = 3;
      ctx.strokeStyle = gradient;
      ctx.shadowBlur = 16 + frame.bass * 12;
      ctx.shadowColor = frame.colors[0];

      for (let i = 0; i < timeData.length; i++) {
        const x = (i / (timeData.length - 1)) * canvas.width;
        const v = (timeData[i] - 128) / 128;
        const y = centerY + v * amp;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawMountain(frame) {
      const levels = getSpectrumLevels(160);
      clearCanvas(false);

      const baseline = canvas.height * 0.88;
      const gradient = buildLinearGradientFromColors(0, 0, canvas.width, 0, frame);

      ctx.beginPath();
      ctx.moveTo(0, canvas.height);

      for (const level of levels) {
        const x = level.normPos * canvas.width;
        const y = baseline - level.value * canvas.height * 0.68;
        ctx.lineTo(x, y);
      }

      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();

      ctx.fillStyle = gradient;
      ctx.globalAlpha = 0.22;
      ctx.shadowBlur = 18 + frame.bass * 12;
      ctx.shadowColor = frame.colors[0];
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.beginPath();
      for (let i = 0; i < levels.length; i++) {
        const level = levels[i];
        const x = level.normPos * canvas.width;
        const y = baseline - level.value * canvas.height * 0.68;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.strokeStyle = gradient;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawOrbit(frame, t) {
      analyser.getByteFrequencyData(freqData);
      clearCanvas(false);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const bandCount = frame.bandEnergies.length;
      const maxRadius = Math.min(canvas.width, canvas.height) * 0.35;

      ctx.save();
      ctx.translate(cx, cy);

      for (let i = 0; i < bandCount; i++) {
        const energy = frame.bandEnergies[i];
        const radius = ((i + 1) / bandCount) * maxRadius + energy * 30;
        const color = getModeColor(frame, i, bandCount === 1 ? 0 : i / (bandCount - 1), energy);

        ctx.beginPath();
        ctx.strokeStyle = hexToRgba(color, 0.20 + energy * 0.45);
        ctx.lineWidth = 1.5 + energy * 3;
        ctx.shadowBlur = 14 + energy * 14;
        ctx.shadowColor = color;
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();

        const particles = 3 + Math.floor(energy * 7);
        for (let p = 0; p < particles; p++) {
          const angle = t * (0.35 + i * 0.08) + p * ((Math.PI * 2) / particles);
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;
          const r = 2 + energy * 6;

          ctx.beginPath();
          ctx.fillStyle = color;
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function draw(now = 0) {
      rafId = requestAnimationFrame(draw);

      if (!analyser || !freqData || !timeData) return;

      analyser.getByteFrequencyData(freqData);
      const frame = getFrameData();
      const t = now * 0.001;
      const mode = visualizerSelect.value;

      if (mode === "bars") drawBars(frame);
      else if (mode === "mirror") drawMirror(frame);
      else if (mode === "circle") drawCircle(frame, t);
      else if (mode === "starburst") drawStarburst(frame, t);
      else if (mode === "tunnel") drawTunnel(frame, t);
      else if (mode === "skyline") drawSkyline(frame);
      else if (mode === "dots") drawDots(frame);
      else if (mode === "wave") drawWave(frame);
      else if (mode === "mountain") drawMountain(frame);
      else if (mode === "orbit") drawOrbit(frame, t);
    }

    startBtn.addEventListener("click", async () => {
      await startVisualizer(deviceSelect.value);
    });

    stopBtn.addEventListener("click", stopVisualizer);

    changeDeviceBtn.addEventListener("click", async () => {
      await startVisualizer(deviceSelect.value);
    });

    fftSizeSelect.addEventListener("change", () => {
      if (analyser) {
        analyser.fftSize = parseInt(fftSizeSelect.value, 10);
        rebuildDataArrays();
      }
      pokeUI();
    });

    bandSplitSelect.addEventListener("change", () => {
      currentBandColors = adaptColorsToCount(currentBandColors, getBandCount());
      if (paletteSelect.value !== "custom") {
        currentBandColors = getPaletteColors(paletteSelect.value, getBandCount());
      }
      renderBandColorEditors();
      pokeUI();
    });

    paletteSelect.addEventListener("change", () => {
      applyPaletteSelection();
      pokeUI();
    });

    modeSelect.addEventListener("change", () => {
      clearCanvas(true);
      pokeUI();
    });

    visualizerSelect.addEventListener("change", () => {
      clearCanvas(true);
      pokeUI();
    });

    sensitivitySlider.addEventListener("input", () => {
      updateSliderLabels();
      pokeUI();
    });

    trailSlider.addEventListener("input", () => {
      updateSliderLabels();
      pokeUI();
    });

    deviceSelect.addEventListener("change", pokeUI);

    if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
      navigator.mediaDevices.addEventListener("devicechange", loadDevices);
    }

    updateSliderLabels();
    currentBandColors = getPaletteColors("neon", getBandCount());
    renderBandColorEditors();
    loadDevices();
    clearCanvas(true);
    pokeUI();
  </script>
</body>
</html>
