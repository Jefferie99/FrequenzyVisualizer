<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frequency Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .controls {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 12px;
      border-radius: 10px;
    }

    button, select, input[type="color"] {
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      background: #2b2b2b;
      color: white;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #3b3b3b;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: black;
    }

    #status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(0,0,0,0.65);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
      color: #ccc;
    }

    #deviceSelect {
      max-width: 260px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>

    <label>
      FFT size
      <select id="fftSizeSelect">
        <option value="1024" selected>1024</option>
        <option value="2048">2048</option>
        <option value="4096">4096</option>
      </select>
    </label>

    <label>
      Color
      <input type="color" id="colorPicker" value="#00ff66" />
    </label>

    <label>
      Device
      <select id="deviceSelect">
        <option value="">Default microphone</option>
      </select>
    </label>

    <button id="changeDeviceBtn" disabled>Change device</button>
  </div>

  <canvas id="canvas"></canvas>
  <div id="status">Idle</div>

  <script>
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let silentGain = null;
    let mediaStream = null;
    let rafId = null;
    let dataArray = null;
    let currentDeviceId = "";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const fftSizeSelect = document.getElementById("fftSizeSelect");
    const colorPicker = document.getElementById("colorPicker");
    const deviceSelect = document.getElementById("deviceSelect");
    const changeDeviceBtn = document.getElementById("changeDeviceBtn");
    const statusEl = document.getElementById("status");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function setStatus(text) {
      statusEl.textContent = text;
    }

    async function loadDevices() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(device => device.kind === "audioinput");

        deviceSelect.innerHTML = "";

        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "Default microphone";
        deviceSelect.appendChild(defaultOption);

        audioInputs.forEach((device, index) => {
          const option = document.createElement("option");
          option.value = device.deviceId;
          option.textContent = device.label || `Microphone ${index + 1}`;
          deviceSelect.appendChild(option);
        });

        deviceSelect.value = currentDeviceId;
      } catch (err) {
        console.error("Device load error:", err);
      }
    }

    function cleanupAudio() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      if (sourceNode) {
        try { sourceNode.disconnect(); } catch (e) {}
        sourceNode = null;
      }

      if (analyser) {
        try { analyser.disconnect(); } catch (e) {}
        analyser = null;
      }

      if (silentGain) {
        try { silentGain.disconnect(); } catch (e) {}
        silentGain = null;
      }

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
    }

    async function startVisualizer(deviceId = "") {
      try {
        cleanupAudio();
        setStatus("Requesting microphone...");

        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioCtx.state === "suspended") {
          await audioCtx.resume();
        }

        const constraints = {
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        };

        if (deviceId) {
          constraints.audio.deviceId = { exact: deviceId };
        }

        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

        currentDeviceId = deviceId;

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = parseInt(fftSizeSelect.value, 10);
        analyser.smoothingTimeConstant = 0.8;
        analyser.minDecibels = -90;
        analyser.maxDecibels = -10;

        dataArray = new Uint8Array(analyser.frequencyBinCount);

        sourceNode = audioCtx.createMediaStreamSource(mediaStream);

        silentGain = audioCtx.createGain();
        silentGain.gain.value = 0;

        sourceNode.connect(analyser);
        analyser.connect(silentGain);
        silentGain.connect(audioCtx.destination);

        startBtn.disabled = true;
        stopBtn.disabled = false;
        changeDeviceBtn.disabled = false;

        await loadDevices();
        deviceSelect.value = currentDeviceId;

        setStatus("Mic running ✅");
        draw();
      } catch (err) {
        console.error(err);
        setStatus("Mic error: " + err.message);
        alert("Microphone error: " + err.message);
      }
    }

    function stopVisualizer() {
      cleanupAudio();

      startBtn.disabled = false;
      stopBtn.disabled = true;
      changeDeviceBtn.disabled = true;

      setStatus("Stopped");

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function draw() {
      rafId = requestAnimationFrame(draw);

      if (!analyser || !dataArray) return;

      analyser.getByteFrequencyData(dataArray);

      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const barColor = colorPicker.value;
      const visibleBars = 128;
      const step = Math.max(1, Math.floor(dataArray.length / visibleBars));
      const barWidth = canvas.width / visibleBars;

      for (let i = 0; i < visibleBars; i++) {
        let sum = 0;
        let count = 0;

        for (let j = 0; j < step; j++) {
          const index = i * step + j;
          if (index < dataArray.length) {
            sum += dataArray[index];
            count++;
          }
        }

        const average = count > 0 ? sum / count : 0;
        const barHeight = (average / 255) * canvas.height;

        const x = i * barWidth;
        const y = canvas.height - barHeight;

        ctx.fillStyle = barColor;
        ctx.fillRect(x, y, Math.max(2, barWidth - 2), barHeight);
      }
    }

    startBtn.addEventListener("click", async () => {
      await startVisualizer(deviceSelect.value);
    });

    stopBtn.addEventListener("click", stopVisualizer);

    changeDeviceBtn.addEventListener("click", async () => {
      await startVisualizer(deviceSelect.value);
    });

    fftSizeSelect.addEventListener("change", () => {
      if (analyser) {
        analyser.fftSize = parseInt(fftSizeSelect.value, 10);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      }
    });

    navigator.mediaDevices.addEventListener?.("devicechange", loadDevices);

    loadDevices();
  </script>
</body>
</html>
