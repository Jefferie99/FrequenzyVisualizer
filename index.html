<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frequency Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #040404;
      --panel: rgba(8, 8, 10, 0.88);
      --border: rgba(255,255,255,0.07);
      --accent: #00ff88;
      --accent2: #ff2ea6;
      --text: #f0f0f0;
      --muted: #888;
      --radius: 12px;
      --font-ui: 'Space Mono', monospace;
      --font-display: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
    }

    /* ── CONTROLS PANEL ── */
    #controls {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 30;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #controls.hidden {
      opacity: 0;
      transform: translateY(-120%);
      pointer-events: none;
    }

    /* Section label above groups */
    .section-label {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    .group {
      display: flex;
      flex-direction: column;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      gap: 0;
    }

    .group-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Pipeline stages — color coded */
    .stage-input   { border-color: rgba(0, 200, 255, 0.15); }
    .stage-behav   { border-color: rgba(255, 160, 0, 0.15); }
    .stage-style   { border-color: rgba(0, 255, 136, 0.15); }
    .stage-fx      { border-color: rgba(255, 46, 166, 0.15); }
    .stage-color   { border-color: rgba(180, 100, 255, 0.15); }
    .stage-ctrl    { border-color: rgba(255,255,255,0.05); }

    .stage-input   .section-label { color: #00c8ff; }
    .stage-behav   .section-label { color: #ffa000; }
    .stage-style   .section-label { color: #00ff88; }
    .stage-fx      .section-label { color: #ff2ea6; }
    .stage-color   .section-label { color: #b464ff; }

    select, button, input[type="color"] {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: 12px;
      padding: 6px 8px;
      cursor: pointer;
      outline: none;
      transition: background 0.15s, border-color 0.15s;
    }

    select option {
      background: #1a1a1a;
      color: #f0f0f0;
    }

    select:hover, button:hover {
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.15);
    }

    select:focus { border-color: var(--accent); }

    button.primary {
      background: rgba(0,255,136,0.12);
      border-color: rgba(0,255,136,0.3);
      color: var(--accent);
      font-weight: 700;
    }
    button.primary:hover {
      background: rgba(0,255,136,0.22);
    }
    button.primary:disabled {
      opacity: 0.35;
      cursor: default;
    }
    button.danger {
      background: rgba(255,60,60,0.10);
      border-color: rgba(255,60,60,0.25);
      color: #ff5555;
    }
    button:disabled { opacity: 0.3; cursor: default; }

    label {
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      color: var(--muted);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      border: none;
      padding: 0;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0,255,136,0.5);
    }
    input[type="range"]::-moz-range-thumb {
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }

    /* Effect slider accent */
    #effectSlider::-webkit-slider-thumb { background: var(--accent2); box-shadow: 0 0 6px rgba(255,46,166,0.5); }
    #effectSlider::-moz-range-thumb { background: var(--accent2); }
    #effectSlider { accent-color: var(--accent2); }

    input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }

    .badge {
      font-size: 11px;
      font-family: var(--font-ui);
      color: var(--muted);
      min-width: 32px;
      text-align: right;
    }

    .status-pill {
      font-size: 11px;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      white-space: nowrap;
    }
    .status-pill.active {
      background: rgba(0,255,136,0.10);
      border-color: rgba(0,255,136,0.3);
      color: var(--accent);
    }

    #bandColorEditors {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .band-editor {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .band-editor input[type="color"] {
      width: 30px;
      height: 26px;
      padding: 2px;
      border-radius: 6px;
    }

    .hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-family: var(--font-ui);
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.08em;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* Pipeline flow indicator */
    .pipe-arrow {
      color: rgba(255,255,255,0.15);
      font-size: 14px;
      align-self: center;
      padding-top: 16px;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="controls">

  <!-- STAGE 1: INPUT -->
  <div class="group stage-input">
    <span class="section-label">① Input</span>
    <div class="group-inner">
      <button id="startBtn" class="primary">Start</button>
      <button id="stopBtn" class="danger" disabled>Stop</button>
      <select id="deviceSelect" style="max-width:180px">
        <option value="">Default mic / VB Cable</option>
      </select>
      <button id="changeDeviceBtn" disabled>⟳</button>
      <select id="fftSizeSelect">
        <option value="1024" selected>FFT 1024</option>
        <option value="2048">FFT 2048</option>
        <option value="4096">FFT 4096</option>
      </select>
    </div>
  </div>

  <span class="pipe-arrow">▸</span>

  <!-- STAGE 2: BEHAVIOUR -->
  <div class="group stage-behav">
    <span class="section-label">② Behaviour</span>
    <div class="group-inner">
      <select id="behaviourSelect">
        <option value="rigid">Rigid</option>
        <option value="wobbly">Wobbly</option>
        <option value="bouncy">Bouncy</option>
        <option value="breathing">Breathing</option>
      </select>
      <label>
        Amount
        <input type="range" id="effectSlider" min="0" max="100" step="1" value="40" />
        <span class="badge" id="effectValue">40</span>
      </label>
    </div>
  </div>

  <span class="pipe-arrow">▸</span>

  <!-- STAGE 3: STYLE -->
  <div class="group stage-style">
    <span class="section-label">③ Style</span>
    <div class="group-inner">
      <select id="visualizerSelect">
        <option value="bars">Bars</option>
        <option value="mirror">Mirror</option>
        <option value="circle">Circle</option>
        <option value="starburst">Starburst</option>
        <option value="tunnel">Tunnel</option>
        <option value="skyline">Skyline</option>
        <option value="dots">Dots</option>
        <option value="wave">Wave</option>
        <option value="mountain">Mountain</option>
        <option value="orbit">Orbit</option>
      </select>
    </div>
  </div>

  <span class="pipe-arrow">▸</span>

  <!-- STAGE 4: POST FX -->
  <div class="group stage-fx">
    <span class="section-label">④ Post FX</span>
    <div class="group-inner">
      <select id="postFxSelect">
        <option value="none">None</option>
        <option value="bloom">Bloom</option>
        <option value="rgbsplit">RGB Split</option>
        <option value="scanlines">Scanlines</option>
        <option value="vhs">VHS</option>
        <option value="pixelate">Pixelate</option>
      </select>
      <label>
        Trails
        <input type="range" id="trailSlider" min="0" max="95" step="1" value="70" />
        <span class="badge" id="trailValue">70</span>
      </label>
    </div>
  </div>

  <span class="pipe-arrow">▸</span>

  <!-- STAGE 5: COLOR -->
  <div class="group stage-color">
    <span class="section-label">⑤ Color</span>
    <div class="group-inner">
      <select id="modeSelect">
        <option value="single">Single</option>
        <option value="split" selected>Split</option>
        <option value="heat">Heat</option>
        <option value="pulse">Pulse</option>
        <option value="rainbow">Rainbow</option>
      </select>
      <select id="bandSplitSelect">
        <option value="1">1 Band</option>
        <option value="3" selected>3 Bands</option>
        <option value="5">5 Bands</option>
      </select>
      <select id="paletteSelect">
        <option value="custom">Custom</option>
        <option value="neon" selected>Neon</option>
        <option value="fire">Fire</option>
        <option value="ocean">Ocean</option>
        <option value="synthwave">Synthwave</option>
        <option value="twitch">Twitch</option>
        <option value="forest">Forest</option>
        <option value="sunset">Sunset</option>
        <option value="mono">Mono</option>
      </select>
      <div id="bandColorEditors"></div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="group stage-ctrl" style="margin-left: auto;">
    <span class="section-label">Controls</span>
    <div class="group-inner">
      <label>
        Sensitivity
        <input type="range" id="sensitivitySlider" min="0.5" max="4" step="0.1" value="1.8" />
        <span class="badge" id="sensitivityValue">1.8</span>
      </label>
      <label>
        <input type="checkbox" id="autoHideChk" checked />
        Auto-hide
      </label>
      <span class="status-pill" id="statusBadge">Idle</span>
    </div>
  </div>

</div>

<div class="hint" id="hint">move mouse to show controls &nbsp;·&nbsp; press H to toggle</div>

<script>
// ═══════════════════════════════════════════════════════
//  AUDIO ENGINE
// ═══════════════════════════════════════════════════════
let audioCtx = null, analyser = null, sourceNode = null;
let silentGain = null, mediaStream = null, rafId = null;
let freqData = null, timeData = null, currentDeviceId = "";

const PALETTES = {
  neon:      ["#ff00cc","#ff7a00","#ffe600","#00ffcc","#6a5cff"],
  fire:      ["#ff2a2a","#ff6a00","#ffb000","#ffd54a","#fff4b0"],
  ocean:     ["#003cff","#0088ff","#00d5ff","#7cf7ff","#e8ffff"],
  synthwave: ["#ff2ea6","#ff5f8f","#b56bff","#5d8dff","#00f7ff"],
  twitch:    ["#9146ff","#b266ff","#e76fff","#00d1ff","#ffffff"],
  forest:    ["#0b5d1e","#198f36","#33c85a","#8cf29a","#dcffe2"],
  sunset:    ["#ff4f6d","#ff7a45","#ffb347","#ffd166","#fff2b2"],
  mono:      ["#3a3a3a","#666666","#9a9a9a","#d0d0d0","#ffffff"]
};

const BAND_PRESETS = {
  1: [{ name:"Full",     low:20,   high:16000 }],
  3: [{ name:"Low",      low:20,   high:250   },
      { name:"Mid",      low:250,  high:2000  },
      { name:"High",     low:2000, high:16000 }],
  5: [{ name:"Sub",      low:20,   high:120   },
      { name:"Low Mid",  low:120,  high:400   },
      { name:"Mid",      low:400,  high:2000  },
      { name:"High Mid", low:2000, high:6000  },
      { name:"Hi",       low:6000, high:16000 }]
};

// ─── DOM refs ───
const canvas         = document.getElementById("canvas");
const ctx            = canvas.getContext("2d");
const controls       = document.getElementById("controls");
const startBtn       = document.getElementById("startBtn");
const stopBtn        = document.getElementById("stopBtn");
const changeDeviceBtn= document.getElementById("changeDeviceBtn");
const visualizerSelect= document.getElementById("visualizerSelect");
const behaviourSelect = document.getElementById("behaviourSelect");
const postFxSelect   = document.getElementById("postFxSelect");
const fftSizeSelect  = document.getElementById("fftSizeSelect");
const modeSelect     = document.getElementById("modeSelect");
const bandSplitSelect= document.getElementById("bandSplitSelect");
const paletteSelect  = document.getElementById("paletteSelect");
const bandColorEditors=document.getElementById("bandColorEditors");
const sensitivitySlider=document.getElementById("sensitivitySlider");
const sensitivityValue =document.getElementById("sensitivityValue");
const trailSlider    = document.getElementById("trailSlider");
const trailValue     = document.getElementById("trailValue");
const effectSlider   = document.getElementById("effectSlider");
const effectValue    = document.getElementById("effectValue");
const deviceSelect   = document.getElementById("deviceSelect");
const autoHideChk    = document.getElementById("autoHideChk");
const statusBadge    = document.getElementById("statusBadge");
const hint           = document.getElementById("hint");

let currentBandColors = [];
let hideTimer = null;

// ─── Canvas resize ───
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// ─── Status ───
function setStatus(text, active = false) {
  statusBadge.textContent = text;
  statusBadge.className = "status-pill" + (active ? " active" : "");
}

// ─── Auto-hide UI ───
function pokeUI() {
  controls.classList.remove("hidden");
  hint.style.opacity = "0";
  clearTimeout(hideTimer);
  if (!autoHideChk.checked) return;
  hideTimer = setTimeout(() => {
    if (!controls.matches(":hover")) {
      controls.classList.add("hidden");
      hint.style.opacity = "1";
    }
  }, 2500);
}

window.addEventListener("mousemove", pokeUI);
window.addEventListener("mousedown", pokeUI);
window.addEventListener("touchstart", pokeUI, { passive: true });
window.addEventListener("keydown", e => {
  if (e.key === "h" || e.key === "H") {
    controls.classList.toggle("hidden");
  }
  pokeUI();
});
controls.addEventListener("mouseenter", () => clearTimeout(hideTimer));
controls.addEventListener("mouseleave", pokeUI);
autoHideChk.addEventListener("change", () => { controls.classList.remove("hidden"); pokeUI(); });

// ─── Colour helpers ───
function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}
function rgbToHex(r,g,b) {
  const h = v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0");
  return `#${h(r)}${h(g)}${h(b)}`;
}
function hexToRgba(hex, a) {
  const {r,g,b} = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`;
}
function lerp(a,b,t) { return a+(b-a)*t; }
function lerpColor(c1,c2,t) {
  const a=hexToRgb(c1), b=hexToRgb(c2);
  return rgbToHex(lerp(a.r,b.r,t), lerp(a.g,b.g,t), lerp(a.b,b.b,t));
}
function mixColors(c1,c2,amt) { return lerpColor(c1,c2,Math.max(0,Math.min(1,amt))); }

// ─── Band / palette helpers ───
function getBandCount()  { return parseInt(bandSplitSelect.value, 10); }
function getBandConfig() { return BAND_PRESETS[getBandCount()]; }

function adaptColorsToCount(colors, count) {
  const src = colors && colors.length ? colors.slice() : PALETTES.neon.slice();
  if (count === src.length) return src.slice();
  if (count === 1) return [src[Math.floor(src.length/2)]];
  if (src.length === 1) return new Array(count).fill(src[0]);
  const result = [];
  for (let i = 0; i < count; i++) {
    const t   = i / (count - 1);
    const pos = t * (src.length - 1);
    const idx = Math.floor(pos);
    result.push(lerpColor(src[idx], src[Math.min(idx+1, src.length-1)], pos-idx));
  }
  return result;
}

function getPaletteColors(name, count) {
  if (name === "custom") return adaptColorsToCount(currentBandColors, count);
  return adaptColorsToCount(PALETTES[name] || PALETTES.neon, count);
}

function renderBandColorEditors() {
  const bands = getBandConfig();
  currentBandColors = adaptColorsToCount(currentBandColors, bands.length);
  bandColorEditors.innerHTML = "";
  bands.forEach((band, i) => {
    const wrap  = document.createElement("div"); wrap.className = "band-editor";
    const lbl   = document.createElement("span"); lbl.textContent = band.name;
    const input = document.createElement("input"); input.type = "color"; input.value = currentBandColors[i];
    input.addEventListener("input", () => { currentBandColors[i] = input.value; paletteSelect.value = "custom"; pokeUI(); });
    wrap.append(lbl, input);
    bandColorEditors.appendChild(wrap);
  });
}

function applyPaletteSelection() {
  currentBandColors = getPaletteColors(paletteSelect.value, getBandCount());
  renderBandColorEditors();
}

// ─── Audio helpers ───
function getSensitivity()  { return parseFloat(sensitivitySlider.value); }
function getEffectAmount() { return parseInt(effectSlider.value, 10) / 100; } // 0–1
function getTrailAmount()  { return parseInt(trailSlider.value, 10); }

function applySensitivity(v) {
  const boosted = v * getSensitivity();
  return Math.min(1, Math.pow(boosted, 0.92));
}

function rebuildDataArrays() {
  if (!analyser) return;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  timeData = new Uint8Array(analyser.fftSize);
}

function freqToBin(freq) {
  if (!freqData || !audioCtx) return 0;
  const nyq = audioCtx.sampleRate / 2;
  return Math.max(0, Math.min(freqData.length-1, Math.floor((Math.max(0,Math.min(freq,nyq))/nyq)*freqData.length)));
}

function getBandBins() {
  return getBandConfig().map(b => ({
    name: b.name,
    low:  freqToBin(b.low),
    high: Math.max(freqToBin(b.high), freqToBin(b.low)+1)
  }));
}

function averageBins(start, end) {
  let sum=0, count=0;
  for (let i=Math.max(0,start); i<Math.min(freqData.length,end); i++) { sum+=freqData[i]; count++; }
  return count ? sum/count : 0;
}

function getBandIndexForBin(bin, bandBins) {
  for (let i=0; i<bandBins.length; i++) if (bin>=bandBins[i].low && bin<bandBins[i].high) return i;
  return bandBins.length-1;
}

function getBandEnergies(bandBins) {
  return bandBins.map(b => applySensitivity(averageBins(b.low,b.high)/255));
}

function getSpectrumLevels(count, maxFreq=16000) {
  const maxBin   = Math.max(8, freqToBin(maxFreq));
  const step     = Math.max(1, Math.floor(maxBin/count));
  const bandBins = getBandBins();
  const levels   = [];
  for (let i=0; i<count; i++) {
    const start = i*step, end = Math.min(maxBin, start+step);
    const avg   = averageBins(start, end);
    const value = applySensitivity(avg/255);
    levels.push({
      value, raw: avg/255,
      bandIndex: getBandIndexForBin(Math.floor((start+end)/2), bandBins),
      normPos: count===1 ? 0 : i/(count-1),
      startBin: start, endBin: end
    });
  }
  return levels;
}

function getGradientColor(colors, t) {
  const p = colors.length ? colors : ["#00ff88"];
  if (p.length===1) return p[0];
  const clamped = Math.max(0,Math.min(1,t));
  const pos = clamped*(p.length-1), idx = Math.floor(pos);
  return lerpColor(p[idx], p[Math.min(idx+1,p.length-1)], pos-idx);
}

function getModeColor(frame, bandIndex, normPos, intensity) {
  const {mode, colors} = frame;
  const bi   = Math.max(0, Math.min(colors.length-1, bandIndex));
  const band = colors[bi] || colors[0] || "#00ff88";
  if (mode==="single")   return mixColors(colors[0]||"#00ff88","#ffffff",intensity*0.18);
  if (mode==="split")    return band;
  if (mode==="heat")     return mixColors(band,"#ffffff",intensity*0.75);
  if (mode==="pulse")    return mixColors(band,"#ffffff",Math.min(0.7,frame.bass*0.45+intensity*0.25));
  if (mode==="rainbow")  return mixColors(getGradientColor(colors,normPos),"#ffffff",intensity*0.22);
  return band;
}

function buildLinearGradient(x0,y0,x1,y1,frame) {
  const grad   = ctx.createLinearGradient(x0,y0,x1,y1);
  const colors = frame.mode==="single" ? [frame.colors[0],frame.colors[0]] : frame.colors;
  if (colors.length===1) { grad.addColorStop(0,colors[0]); grad.addColorStop(1,colors[0]); return grad; }
  colors.forEach((c,i) => grad.addColorStop(colors.length===1 ? 0 : i/(colors.length-1), c));
  return grad;
}

function clearCanvas(forceSolid=false) {
  if (forceSolid || getTrailAmount()<=0) {
    ctx.fillStyle = "#000";
  } else {
    ctx.fillStyle = `rgba(0,0,0,${Math.max(0.025,(100-getTrailAmount())/140)})`;
  }
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function getFrameData() {
  const bandBins    = getBandBins();
  const bandEnergies= getBandEnergies(bandBins);
  const bass        = bandEnergies[0] || 0;
  const colors      = adaptColorsToCount(currentBandColors, getBandCount());
  return { bandBins, bandEnergies, bass, colors, mode: modeSelect.value };
}

// ═══════════════════════════════════════════════════════
//  STAGE 2 — BEHAVIOUR ENGINE
//  Transforms raw spectrum levels before the style draws them.
//  Each behaviour receives levels[] and returns modified levels[].
//  effect = 0..1 (from the slider)
// ═══════════════════════════════════════════════════════
const BEHAVIOURS = {

  rigid(levels, _frame, _t, _effect) {
    // No transformation — pass through unchanged
    return levels;
  },

  wobbly(levels, frame, t, effect) {
    // Each bar gets a sine-wave offset based on its position + time
    return levels.map((lv, i) => {
      const phase  = i * 0.35 + t * 3.2;
      const wobble = Math.sin(phase) * effect * 0.28 * (0.3 + lv.value * 0.7);
      return { ...lv, value: Math.max(0, Math.min(1, lv.value + wobble)) };
    });
  },

  bouncy(levels, frame, t, effect) {
    // Bass-driven snap: bars overshoot proportional to bass energy
    const snap = 1 + frame.bass * effect * 1.4;
    return levels.map(lv => ({
      ...lv,
      value: Math.min(1, lv.value * snap)
    }));
  },

  breathing(levels, frame, t, effect) {
    // Slow global pulse that expands/contracts everything
    const breath = 1 + Math.sin(t * 1.1) * effect * 0.35;
    return levels.map(lv => ({
      ...lv,
      value: Math.min(1, lv.value * breath)
    }));
  }

};

function applyBehaviour(levels, frame, t) {
  const name   = behaviourSelect.value;
  const effect = getEffectAmount();
  const fn     = BEHAVIOURS[name] || BEHAVIOURS.rigid;
  return fn(levels, frame, t, effect);
}

// ═══════════════════════════════════════════════════════
//  STAGE 3 — VISUALIZER STYLES
// ═══════════════════════════════════════════════════════

function drawBars(frame, t) {
  let levels = getSpectrumLevels(110);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  ctx.shadowBlur = 14 + (frame.mode==="pulse" ? frame.bass*28 : 0);
  ctx.shadowColor = frame.colors[0];
  const bw = canvas.width / levels.length;
  for (const lv of levels) {
    const h = lv.value * canvas.height * 0.96;
    const x = lv.normPos * canvas.width;
    const y = canvas.height - h;
    ctx.fillStyle = getModeColor(frame, lv.bandIndex, lv.normPos, lv.value);
    ctx.fillRect(x, y, Math.max(2, bw - 2), h);
  }
  ctx.shadowBlur = 0;
}

function drawMirror(frame, t) {
  let levels = getSpectrumLevels(100);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  const cy = canvas.height/2;
  const bw = canvas.width/levels.length;
  ctx.shadowBlur  = 16+(frame.mode==="pulse"?frame.bass*28:0);
  ctx.shadowColor = frame.colors[0];
  for (const lv of levels) {
    const size = lv.value*canvas.height*0.42;
    const x    = lv.normPos*canvas.width;
    const w    = Math.max(2,bw-2);
    ctx.fillStyle = getModeColor(frame,lv.bandIndex,lv.normPos,lv.value);
    ctx.fillRect(x, cy-size, w, size);
    ctx.fillRect(x, cy,      w, size);
  }
  ctx.shadowBlur = 0;
}

function drawCircle(frame, t) {
  let levels = getSpectrumLevels(180);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  const cx = canvas.width/2, cy = canvas.height/2;
  const pulseScale = frame.mode==="pulse" ? 1+frame.bass*0.22 : 1;
  const base = Math.min(canvas.width,canvas.height)*0.16*pulseScale;
  ctx.save(); ctx.translate(cx,cy); ctx.lineCap="round";
  for (const lv of levels) {
    const angle = lv.normPos*Math.PI*2+t*0.08;
    const extra = lv.value*Math.min(canvas.width,canvas.height)*0.22;
    ctx.beginPath();
    ctx.strokeStyle = getModeColor(frame,lv.bandIndex,lv.normPos,lv.value);
    ctx.lineWidth  = 1.5+lv.value*2.5;
    ctx.shadowBlur = 10+lv.value*10;
    ctx.shadowColor= ctx.strokeStyle;
    ctx.moveTo(Math.cos(angle)*base, Math.sin(angle)*base);
    ctx.lineTo(Math.cos(angle)*(base+extra), Math.sin(angle)*(base+extra));
    ctx.stroke();
  }
  ctx.beginPath(); ctx.lineWidth=2.5;
  ctx.strokeStyle=hexToRgba(frame.colors[0],0.25); ctx.shadowBlur=0;
  ctx.arc(0,0,base,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawStarburst(frame, t) {
  let levels = getSpectrumLevels(220);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  const cx=canvas.width/2, cy=canvas.height/2;
  const inner=Math.min(canvas.width,canvas.height)*0.05;
  ctx.save(); ctx.translate(cx,cy); ctx.lineCap="round";
  for (const lv of levels) {
    const angle = lv.normPos*Math.PI*2+t*0.22;
    const outer = inner+lv.value*Math.min(canvas.width,canvas.height)*0.38;
    ctx.beginPath();
    ctx.strokeStyle=getModeColor(frame,lv.bandIndex,lv.normPos,lv.value);
    ctx.lineWidth=1+lv.value*4; ctx.shadowBlur=14+lv.value*12; ctx.shadowColor=ctx.strokeStyle;
    ctx.moveTo(Math.cos(angle)*inner, Math.sin(angle)*inner);
    ctx.lineTo(Math.cos(angle)*outer, Math.sin(angle)*outer);
    ctx.stroke();
  }
  ctx.restore(); ctx.shadowBlur=0;
}

function drawTunnel(frame, t) {
  analyser.getByteFrequencyData(freqData);
  clearCanvas(false);
  const cx=canvas.width/2, cy=canvas.height/2;
  const maxR=Math.min(canvas.width,canvas.height)*0.43;
  const ringCount=Math.max(12,frame.bandEnergies.length*4);
  ctx.save(); ctx.translate(cx,cy);
  for (let i=0; i<ringCount; i++) {
    const bi     = i%frame.bandEnergies.length;
    const energy = frame.bandEnergies[bi];
    const radius = ((i+1)/ringCount)*maxR+energy*18+(frame.mode==="pulse"?frame.bass*14:0);
    const color  = getModeColor(frame,bi,i/Math.max(1,ringCount-1),energy);
    ctx.beginPath();
    ctx.strokeStyle=hexToRgba(color,0.20+energy*0.70);
    ctx.lineWidth=1+energy*4; ctx.shadowBlur=10+energy*16; ctx.shadowColor=color;
    ctx.arc(0,0,radius, t*0.1+i*0.15, t*0.1+i*0.15+Math.PI*1.75);
    ctx.stroke();
  }
  ctx.restore(); ctx.shadowBlur=0;
}

function drawSkyline(frame, t) {
  let levels = getSpectrumLevels(120);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  const bw = canvas.width/levels.length;
  for (const lv of levels) {
    const h = 20+lv.value*canvas.height*0.72;
    const x = lv.normPos*canvas.width, y = canvas.height-h;
    const color = getModeColor(frame,lv.bandIndex,lv.normPos,lv.value);
    const grad = ctx.createLinearGradient(0,y,0,canvas.height);
    grad.addColorStop(0,hexToRgba(color,0.95)); grad.addColorStop(1,hexToRgba(color,0.05));
    ctx.fillStyle=grad; ctx.shadowBlur=14+lv.value*8; ctx.shadowColor=color;
    ctx.fillRect(x,y,Math.max(2,bw-1),h);
    ctx.fillStyle=color; ctx.fillRect(x,y,Math.max(2,bw-1),2);
  }
  ctx.shadowBlur=0;
}

function drawDots(frame, t) {
  let levels = getSpectrumLevels(95);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  for (const lv of levels) {
    const x=lv.normPos*canvas.width, y=canvas.height-lv.value*canvas.height;
    const r=2+lv.value*13;
    const color=getModeColor(frame,lv.bandIndex,lv.normPos,lv.value);
    ctx.shadowBlur=18+lv.value*12; ctx.shadowColor=color;
    ctx.beginPath(); ctx.fillStyle=hexToRgba(color,0.95); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle=hexToRgba(color,0.18); ctx.arc(x,y,r*2.3,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;
}

function drawWave(frame, t) {
  analyser.getByteTimeDomainData(timeData);
  clearCanvas(false);
  const centerY = canvas.height/2;
  const effect  = getEffectAmount();
  const behav   = behaviourSelect.value;
  const amp     = canvas.height*0.25*getSensitivity()*(frame.mode==="pulse"?1+frame.bass*0.2:1);
  const grad    = buildLinearGradient(0,0,canvas.width,0,frame);
  ctx.beginPath(); ctx.lineWidth=3; ctx.strokeStyle=grad;
  ctx.shadowBlur=16+frame.bass*12; ctx.shadowColor=frame.colors[0];
  for (let i=0; i<timeData.length; i++) {
    const x = (i/(timeData.length-1))*canvas.width;
    let v = (timeData[i]-128)/128;
    // Apply behaviour to wave amplitude
    if (behav==="wobbly")   v += Math.sin(i*0.08+t*3.2)*effect*0.4;
    if (behav==="bouncy")   v *= 1+frame.bass*effect*1.4;
    if (behav==="breathing") v *= 1+Math.sin(t*1.1)*effect*0.35;
    const y = centerY+v*amp;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke(); ctx.shadowBlur=0;
}

function drawMountain(frame, t) {
  let levels = getSpectrumLevels(160);
  levels = applyBehaviour(levels, frame, t);
  clearCanvas(false);
  const baseline=canvas.height*0.88;
  const grad=buildLinearGradient(0,0,canvas.width,0,frame);
  ctx.beginPath(); ctx.moveTo(0,canvas.height);
  for (const lv of levels) ctx.lineTo(lv.normPos*canvas.width, baseline-lv.value*canvas.height*0.68);
  ctx.lineTo(canvas.width,canvas.height); ctx.closePath();
  ctx.fillStyle=grad; ctx.globalAlpha=0.22;
  ctx.shadowBlur=18+frame.bass*12; ctx.shadowColor=frame.colors[0];
  ctx.fill(); ctx.globalAlpha=1;
  ctx.beginPath();
  for (let i=0; i<levels.length; i++) {
    const lv=levels[i];
    const x=lv.normPos*canvas.width, y=baseline-lv.value*canvas.height*0.68;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle=grad; ctx.lineWidth=2.5; ctx.stroke(); ctx.shadowBlur=0;
}

function drawOrbit(frame, t) {
  analyser.getByteFrequencyData(freqData);
  clearCanvas(false);
  const cx=canvas.width/2, cy=canvas.height/2;
  const bc=frame.bandEnergies.length;
  const maxR=Math.min(canvas.width,canvas.height)*0.35;
  const effect=getEffectAmount();
  const behav=behaviourSelect.value;
  ctx.save(); ctx.translate(cx,cy);
  for (let i=0; i<bc; i++) {
    let energy=frame.bandEnergies[i];
    if (behav==="bouncy")   energy=Math.min(1,energy*(1+frame.bass*effect*1.4));
    if (behav==="breathing") energy=Math.min(1,energy*(1+Math.sin(t*1.1)*effect*0.35));
    const radius=((i+1)/bc)*maxR+energy*30;
    const color=getModeColor(frame,i,bc===1?0:i/(bc-1),energy);
    ctx.beginPath();
    ctx.strokeStyle=hexToRgba(color,0.20+energy*0.45);
    ctx.lineWidth=1.5+energy*3; ctx.shadowBlur=14+energy*14; ctx.shadowColor=color;
    ctx.arc(0,0,radius,0,Math.PI*2); ctx.stroke();
    const particles=3+Math.floor(energy*7);
    for (let p=0; p<particles; p++) {
      const angle=t*(0.35+i*0.08)+p*((Math.PI*2)/particles);
      const r=2+energy*6;
      ctx.beginPath(); ctx.fillStyle=color;
      ctx.arc(Math.cos(angle)*radius, Math.sin(angle)*radius, r, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore(); ctx.shadowBlur=0;
}

// ═══════════════════════════════════════════════════════
//  STAGE 4 — POST-PROCESS EFFECTS
//  Runs AFTER the visualizer draws to the canvas.
//  Each effect reads the current canvas pixels and writes back.
// ═══════════════════════════════════════════════════════
const POST_FX = {

  none() { /* nothing */ },

  bloom(frame) {
    // Simple glow: draw the canvas back on itself with additive blending
    ctx.globalCompositeOperation = "screen";
    ctx.globalAlpha = 0.18 + frame.bass * 0.12;
    ctx.filter = "blur(8px)";
    ctx.drawImage(canvas, 0, 0);
    ctx.filter = "none";
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  },

  rgbsplit(frame) {
    const amount = 4 + frame.bass * 10;
    ctx.globalCompositeOperation = "screen";
    ctx.globalAlpha = 0.45;
    // Red channel offset
    ctx.filter = "url(#redChannel)";
    // Approximate with tinted draws
    ctx.globalAlpha = 0.25;
    ctx.filter = "none";
    // Draw red-shifted copy
    ctx.shadowColor = "red";
    ctx.globalCompositeOperation = "screen";
    ctx.drawImage(canvas, -amount, 0, canvas.width, canvas.height);
    // Draw blue-shifted copy
    ctx.drawImage(canvas,  amount, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  },

  scanlines() {
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = "#000";
    for (let y = 0; y < canvas.height; y += 3) {
      ctx.fillRect(0, y, canvas.width, 1);
    }
    ctx.globalAlpha = 1;
  },

  vhs(frame) {
    // Scanlines + slight horizontal noise
    POST_FX.scanlines();
    ctx.globalAlpha = 0.04 + frame.bass * 0.06;
    ctx.fillStyle = "#fff";
    const noiseY = Math.random() * canvas.height;
    ctx.fillRect(0, noiseY, canvas.width, 1 + Math.random() * 3);
    ctx.globalAlpha = 1;
    // Colour bleed
    ctx.globalCompositeOperation = "screen";
    ctx.globalAlpha = 0.08;
    ctx.drawImage(canvas, Math.random()*4-2, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  },

  pixelate(frame) {
    const size = Math.max(2, Math.floor(4 + frame.bass * 12));
    const w    = canvas.width, h = canvas.height;
    // Downscale then upscale trick using getImageData is too slow per-frame.
    // Instead we use canvas scale trick with imageSmoothingEnabled off.
    const offscreen = document.createElement("canvas");
    offscreen.width  = Math.floor(w / size);
    offscreen.height = Math.floor(h / size);
    const offCtx = offscreen.getContext("2d");
    offCtx.drawImage(canvas, 0, 0, offscreen.width, offscreen.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(offscreen, 0, 0, w, h);
    ctx.imageSmoothingEnabled = true;
  }

};

function applyPostFx(frame) {
  const name = postFxSelect.value;
  const fn   = POST_FX[name];
  if (fn) fn(frame);
}

// ═══════════════════════════════════════════════════════
//  MAIN DRAW LOOP
// ═══════════════════════════════════════════════════════
function draw(now=0) {
  rafId = requestAnimationFrame(draw);
  if (!analyser || !freqData || !timeData) return;

  analyser.getByteFrequencyData(freqData);
  const frame = getFrameData();
  const t     = now * 0.001;
  const style = visualizerSelect.value;

  // Stage 3 — Style
  if      (style==="bars")      drawBars(frame,t);
  else if (style==="mirror")    drawMirror(frame,t);
  else if (style==="circle")    drawCircle(frame,t);
  else if (style==="starburst") drawStarburst(frame,t);
  else if (style==="tunnel")    drawTunnel(frame,t);
  else if (style==="skyline")   drawSkyline(frame,t);
  else if (style==="dots")      drawDots(frame,t);
  else if (style==="wave")      drawWave(frame,t);
  else if (style==="mountain")  drawMountain(frame,t);
  else if (style==="orbit")     drawOrbit(frame,t);

  // Stage 4 — Post FX
  applyPostFx(frame);
}

// ═══════════════════════════════════════════════════════
//  AUDIO DEVICE MANAGEMENT
// ═══════════════════════════════════════════════════════
async function loadDevices() {
  try {
    const devices    = await navigator.mediaDevices.enumerateDevices();
    const audioInputs= devices.filter(d=>d.kind==="audioinput");
    deviceSelect.innerHTML = "";
    const def = document.createElement("option"); def.value=""; def.textContent="Default mic / VB Cable";
    deviceSelect.appendChild(def);
    audioInputs.forEach((d,i) => {
      const o = document.createElement("option"); o.value=d.deviceId; o.textContent=d.label||`Microphone ${i+1}`;
      deviceSelect.appendChild(o);
    });
    deviceSelect.value = currentDeviceId;
  } catch(e) { console.error(e); }
}

function cleanupAudio() {
  if (rafId)       { cancelAnimationFrame(rafId); rafId=null; }
  if (sourceNode)  { try{sourceNode.disconnect();}catch(e){} sourceNode=null; }
  if (analyser)    { try{analyser.disconnect();}catch(e){} analyser=null; }
  if (silentGain)  { try{silentGain.disconnect();}catch(e){} silentGain=null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
  freqData=null; timeData=null;
}

async function startVisualizer(deviceId="") {
  try {
    cleanupAudio();
    setStatus("Starting…");
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state==="suspended") await audioCtx.resume();

    const constraints = {
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    };
    if (deviceId) constraints.audio.deviceId = { exact: deviceId };

    mediaStream  = await navigator.mediaDevices.getUserMedia(constraints);
    currentDeviceId = deviceId;

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = parseInt(fftSizeSelect.value,10);
    analyser.smoothingTimeConstant = 0.84;
    analyser.minDecibels = -90;
    analyser.maxDecibels = -10;
    rebuildDataArrays();

    sourceNode = audioCtx.createMediaStreamSource(mediaStream);
    silentGain = audioCtx.createGain(); silentGain.gain.value=0;
    sourceNode.connect(analyser);
    analyser.connect(silentGain);
    silentGain.connect(audioCtx.destination);

    startBtn.disabled=true; stopBtn.disabled=false; changeDeviceBtn.disabled=false;
    await loadDevices(); deviceSelect.value=currentDeviceId;
    setStatus("Live ✦", true);
    pokeUI(); draw();
  } catch(err) {
    console.error(err); setStatus("Error");
    alert("Microphone error: "+err.message);
  }
}

function stopVisualizer() {
  cleanupAudio();
  startBtn.disabled=false; stopBtn.disabled=true; changeDeviceBtn.disabled=true;
  setStatus("Stopped");
  clearCanvas(true); pokeUI();
}

// ─── Event listeners ───
startBtn.addEventListener("click", () => startVisualizer(deviceSelect.value));
stopBtn.addEventListener("click", stopVisualizer);
changeDeviceBtn.addEventListener("click", () => startVisualizer(deviceSelect.value));

fftSizeSelect.addEventListener("change", () => {
  if (analyser) { analyser.fftSize=parseInt(fftSizeSelect.value,10); rebuildDataArrays(); } pokeUI();
});
bandSplitSelect.addEventListener("change", () => {
  currentBandColors = adaptColorsToCount(currentBandColors, getBandCount());
  if (paletteSelect.value!=="custom") currentBandColors=getPaletteColors(paletteSelect.value,getBandCount());
  renderBandColorEditors(); pokeUI();
});
paletteSelect.addEventListener("change", () => { applyPaletteSelection(); pokeUI(); });
modeSelect.addEventListener("change",      () => { clearCanvas(true); pokeUI(); });
visualizerSelect.addEventListener("change",() => { clearCanvas(true); pokeUI(); });
behaviourSelect.addEventListener("change", () => { clearCanvas(true); pokeUI(); });
postFxSelect.addEventListener("change",    () => { clearCanvas(true); pokeUI(); });

sensitivitySlider.addEventListener("input", () => {
  sensitivityValue.textContent = Number(sensitivitySlider.value).toFixed(1); pokeUI();
});
trailSlider.addEventListener("input", () => { trailValue.textContent=trailSlider.value; pokeUI(); });
effectSlider.addEventListener("input",() => { effectValue.textContent=effectSlider.value; pokeUI(); });
deviceSelect.addEventListener("change", pokeUI);

if (navigator.mediaDevices?.addEventListener) {
  navigator.mediaDevices.addEventListener("devicechange", loadDevices);
}

// ─── Init ───
sensitivityValue.textContent = sensitivitySlider.value;
trailValue.textContent       = trailSlider.value;
effectValue.textContent      = effectSlider.value;
currentBandColors = getPaletteColors("neon", getBandCount());
renderBandColorEditors();
loadDevices();
clearCanvas(true);
pokeUI();
</script>
